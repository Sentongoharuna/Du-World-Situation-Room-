name: RUNNINGBALL2 AIRCRAFT COMMAND V4 ANDROID APK
run-name: "RUNNINGBALL2 AIR COMMAND V4 #${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/RUNNINGBALL2-AIRCRAFT-COMMAND-V4-APK.yml'

permissions:
  contents: read

concurrency:
  group: runningball2-aircommand4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout recipient repository (no external source imports)
        uses: actions/checkout@v4

      # Original RUNNINGBALL2 archive, verified against the original source SHA-256.
      # Embedded in this one workflow so GitHub needs no missing .tar.gz upload.
      - name: Recover exact original RUNNINGBALL2 source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, re
          from pathlib import Path
          source = Path(".github/workflows/RUNNINGBALL2-PROTECTED-BASE-SELF-CONTAINED.yml").read_text(encoding="utf-8")
          m = re.search(r"<<'RUNNINGBALL2_SOURCE_BASE64'\n(.*?)\n\s*RUNNINGBALL2_SOURCE_BASE64", source, re.S)
          if m is None:
              raise SystemExit("The original RUNNINGBALL2 archive is missing")
          archive = base64.b64decode("".join(m.group(1).split()), validate=True)
          expected = "1be8caba512b4fa2430f636fcfc6a4a73a1a484a9d3b64e829f3d3a606e7d32a"
          assert hashlib.sha256(archive).hexdigest() == expected, "Wrong source SHA-256"
          Path("DUWM-1-2-20-2-20-FULL-REGRESSION-FIX2-SOURCE.tar.gz").write_bytes(archive)
          print("Original RUNNINGBALL2 archive restored and verified")
          PY

      - name: Extract original RUNNINGBALL2 project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runningball2"
          tar -xzf DUWM-1-2-20-2-20-FULL-REGRESSION-FIX2-SOURCE.tar.gz -C "$RUNNER_TEMP/runningball2"
          PROJECT_DIR="$RUNNER_TEMP/runningball2/world-situation-room-native-1-2-20-2-20"
          test -s "$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Run original cumulative full source-to-globe regression gate
        shell: bash
        run: |
          set -euo pipefail
          bash "$PROJECT_DIR/scripts/verify-1-2-20-2-20-full-regression.sh" "$PROJECT_DIR"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Verify supported Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: RUNNINGBALL2 add live wallpaper mode
        shell: bash
        run: |
          set -euo pipefail
          PKG="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom"
          RES="$PROJECT_DIR/app/src/main/res"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -s "$PKG/SatelliteMapView.java"
          test -s "$MANIFEST"
          GLOBE_BEFORE="$(sha256sum "$PKG/SatelliteMapView.java" | awk '{print $1}')"
          mkdir -p "$RES/xml" "$RES/values"

          cat > "$PKG/DuwmLiveWallpaperService.java" <<'JAVA'
          package com.sentongoharuna.worldsituationroom;
          import android.service.wallpaper.WallpaperService;
          import android.view.SurfaceHolder;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Color;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;

          public final class DuwmLiveWallpaperService extends WallpaperService {
            @Override public Engine onCreateEngine(){ return new GlobeEngine(); }
            private final class GlobeEngine extends Engine {
              private final Handler ui=new Handler(Looper.getMainLooper());
              private final Paint earth=new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint grid=new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint accent=new Paint(Paint.ANTI_ALIAS_FLAG);
              private boolean visible=false, pending=false;
              private long lastMs=0L;
              private double rotation=0.0d;
              private static final long FRAME_MS=33L;

              private final Runnable tick=new Runnable(){
                @Override public void run(){
                  pending=false;
                  if(!visible)return;
                  long now=SystemClock.uptimeMillis();
                  long dt=lastMs==0L?FRAME_MS:Math.min(100L,Math.max(0L,now-lastMs));
                  lastMs=now;
                  rotation=(rotation+(dt/1000.0d)*4.0d)%360.0d;
                  drawGlobe();
                  schedule();
                }
              };

              GlobeEngine(){
                earth.setColor(Color.rgb(5,18,31)); earth.setStyle(Paint.Style.FILL);
                grid.setColor(Color.argb(95,58,185,220)); grid.setStyle(Paint.Style.STROKE); grid.setStrokeWidth(1.2f);
                accent.setColor(Color.rgb(58,220,132)); accent.setStyle(Paint.Style.STROKE); accent.setStrokeWidth(2f);
              }
              private void schedule(){ if(!visible||pending)return; pending=true; ui.postDelayed(tick,FRAME_MS); }
              private void stop(){ visible=false; pending=false; ui.removeCallbacks(tick); }
              @Override public void onVisibilityChanged(boolean v){ visible=v; if(v){lastMs=0L;schedule();}else stop(); }
              @Override public void onSurfaceChanged(SurfaceHolder h,int f,int w,int x){super.onSurfaceChanged(h,f,w,x);if(visible)drawGlobe();}
              @Override public void onSurfaceDestroyed(SurfaceHolder h){stop();super.onSurfaceDestroyed(h);}
              @Override public void onDestroy(){stop();super.onDestroy();}

              private void drawGlobe(){
                SurfaceHolder h=getSurfaceHolder(); Canvas c=null;
                try{
                  c=h.lockCanvas(); if(c==null)return; c.drawColor(Color.BLACK);
                  float w=c.getWidth(), ht=c.getHeight(), cx=w*.5f, cy=ht*.48f, r=Math.min(w,ht)*.34f;
                  c.drawCircle(cx,cy,r,earth);
                  for(int lat=-60;lat<=60;lat+=30){
                    float y=cy-(float)Math.sin(Math.toRadians(lat))*r;
                    float rx=(float)(Math.cos(Math.toRadians(lat))*r);
                    c.drawOval(cx-rx,y-r*.08f,cx+rx,y+r*.08f,grid);
                  }
                  for(int lon=0;lon<180;lon+=30){
                    double a=Math.toRadians(lon+rotation); float rx=(float)(Math.abs(Math.cos(a))*r);
                    c.drawOval(cx-rx,cy-r,cx+rx,cy+r,grid);
                  }
                  double a=Math.toRadians(rotation);
                  c.drawCircle(cx+(float)Math.cos(a)*r,cy+(float)Math.sin(a)*r*.25f,7f,accent);
                } finally { if(c!=null)h.unlockCanvasAndPost(c); }
              }
            }
          }
          JAVA

          cat > "$PKG/LiveWallpaperLauncherActivity.java" <<'JAVA'
          package com.sentongoharuna.worldsituationroom;
          import android.app.Activity;
          import android.app.WallpaperManager;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.os.Bundle;
          public final class LiveWallpaperLauncherActivity extends Activity {
            @Override protected void onCreate(Bundle b){
              super.onCreate(b);
              Intent i=new Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER);
              i.putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,new ComponentName(this,DuwmLiveWallpaperService.class));
              try{startActivity(i);}catch(Throwable t){startActivity(new Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER));}
              finish();
            }
          }
          JAVA

          cat > "$RES/xml/duwm_live_wallpaper.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
            android:description="@string/duwm_live_wallpaper_description" />
          XML

          cat > "$RES/values/duwm_live_wallpaper_strings.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="duwm_live_wallpaper_name">DU World Monitor Live Globe</string>
            <string name="duwm_live_wallpaper_description">Live rotating DU World Monitor globe wallpaper.</string>
          </resources>
          XML

          python3 - "$MANIFEST" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          if 'DuwmLiveWallpaperService' not in s:
              at=s.rfind('</application>')
              if at<0: raise SystemExit("application close tag missing")
              block='''\
              <service android:name=".DuwmLiveWallpaperService" android:exported="true"
                android:label="@string/duwm_live_wallpaper_name"
                android:permission="android.permission.BIND_WALLPAPER">
                <intent-filter><action android:name="android.service.wallpaper.WallpaperService" /></intent-filter>
                <meta-data android:name="android.service.wallpaper" android:resource="@xml/duwm_live_wallpaper" />
              </service>
              <activity android:name=".LiveWallpaperLauncherActivity" android:exported="false" />
              '''
              p.write_text(s[:at]+block+s[at:])
          PY

          GLOBE_AFTER="$(sha256sum "$PKG/SatelliteMapView.java" | awk '{print $1}')"
          test "$GLOBE_BEFORE" = "$GLOBE_AFTER"
          echo "RUNNINGBALL2 WORKING GLOBE SOURCE PRESERVED"

      # Separate fetch/overlay layer. The 33ms WallpaperService loop is protected.
      # Tracks are drawn in an independent, north-up 250 NM radar inset.
      - name: Add live aircraft intelligence (isolated optional overlay)
        shell: bash
        run: |
          set -euo pipefail
          PKG="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom"
          cat > "$PKG/DuwmAircraftIntelligence.java" <<'JAVA_AIR1'
          package com.sentongoharuna.worldsituationroom;
          
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.os.Handler;
          import android.os.Looper;
          
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          
          /**
           * Optional aircraft-only overlay for the protected RUNNINGBALL2 WallpaperService.
           * Never performs networking or parsing in the original 33ms SurfaceHolder draw loop.
           * Data coverage is a 250 NM radial query around Kampala, NOT world-wide air traffic.
           */
          final class DuwmAircraftIntelligence {
              private static final double KAMPALA_LAT = 0.3476;
              private static final double KAMPALA_LON = 32.5825;
              private static final double RADIUS_NM = 250d;
              private static final String SOURCE = "https://api.adsb.lol/v2/point/0.3476/32.5825/250";
              private static final long POLL_MS = 60_000L;
              private static final long STALE_MS = 180_000L;
              private static final long MAX_CACHED_MS = 300_000L;
              private static final long TRAIL_RETENTION_MS = 900_000L;
          
              private final Handler ui = new Handler(Looper.getMainLooper());
              private final ExecutorService io = Executors.newSingleThreadExecutor();
              private final Map<String, ArrayDeque<Fix>> history = new HashMap<>();
              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint text = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final float dp;
              private final float sp;
              private volatile Snapshot snapshot = Snapshot.startup();
              private boolean visible;
              private boolean closed;
          
              private final Runnable poll = new Runnable() {
                  @Override public void run() {
                      if (!visible || closed) return;
                      io.execute(new Runnable() {
                          @Override public void run() { refresh(); }
                      });
                      ui.postDelayed(this, POLL_MS);
                  }
              };
          
              DuwmAircraftIntelligence(Context context) {
                  dp = context.getResources().getDisplayMetrics().density;
                  sp = context.getResources().getDisplayMetrics().scaledDensity;
                  text.setTypeface(android.graphics.Typeface.MONOSPACE);
              }
          
              void setVisible(boolean value) {
                  ui.removeCallbacks(poll);
                  visible = value && !closed;
                  if (visible) ui.post(poll);
              }
          
              void close() {
                  closed = true;
                  visible = false;
                  ui.removeCallbacks(poll);
                  io.shutdownNow();
              }
          
              private void refresh() {
                  HttpURLConnection conn = null;
                  try {
                      conn = (HttpURLConnection) new URL(SOURCE).openConnection();
                      conn.setRequestMethod("GET");
                      conn.setRequestProperty("Accept", "application/json");
                      conn.setRequestProperty("User-Agent", "DUWM-RUNNINGBALL2-Aircraft/1.0");
                      conn.setConnectTimeout(8_000);
                      conn.setReadTimeout(8_000);
                      final int response = conn.getResponseCode();
                      if (response != 200) {
                          throw new IllegalStateException(response == 429 ? "RATE LIMITED" : "HTTP " + response);
                      }
                      final ByteArrayOutputStream bytes = new ByteArrayOutputStream();
                      try (InputStream in = conn.getInputStream()) {
                          byte[] buffer = new byte[8192];
                          int n;
                          while ((n = in.read(buffer)) != -1) {
                              if (bytes.size() + n > 2_000_000) throw new IllegalStateException("OVERSIZED FEED");
                              bytes.write(buffer, 0, n);
                          }
                      }
                      JSONObject root = new JSONObject(new String(bytes.toByteArray(), StandardCharsets.UTF_8));
                      JSONArray data = root.optJSONArray("ac");
                      if (data == null) throw new IllegalStateException("NO AIRCRAFT ARRAY");
                      final long now = System.currentTimeMillis();
                      List<Aircraft> aircraft = new ArrayList<>();
                      for (int i = 0; i < data.length() && i < 1_000; i++) {
                          JSONObject row = data.optJSONObject(i);
                          if (row == null) continue;
                          String id = row.optString("hex", "").trim();
                          if (!id.matches("(?i)[0-9a-f]{6}")) continue;
                          double lat = row.optDouble("lat", Double.NaN);
                          double lon = row.optDouble("lon", Double.NaN);
                          double seen = row.optDouble("seen_pos", Double.NaN);
                          if (!valid(lat) || !valid(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180
                                  || !valid(seen) || seen < 0 || seen > 120) continue;
                          double distance = distanceNm(KAMPALA_LAT, KAMPALA_LON, lat, lon);
                          if (distance > RADIUS_NM) continue;
                          String callsign = row.optString("flight", "").trim();
                          if (callsign.isEmpty()) callsign = id.toUpperCase(Locale.US);
                          double altitude = row.optDouble("alt_baro", Double.NaN);
                          double speed = row.optDouble("gs", Double.NaN); // ADS-B ground speed in knots
                          double heading = row.optDouble("track", Double.NaN);
                          Fix current = new Fix(lat, lon, now - (long) (seen * 1000d));
                          ArrayDeque<Fix> track = history.get(id);
                          if (track == null) { track = new ArrayDeque<>(); history.put(id, track); }
                          Fix previous = track.peekLast();
                          if (previous == null || (previous.timeMs < current.timeMs
                                  && distanceNm(previous.lat, previous.lon, current.lat, current.lon) >= 0.05d)) {
                              track.addLast(current);
                          }
                          while (track.size() > 6) track.removeFirst();
                          while (!track.isEmpty() && now - track.peekFirst().timeMs > TRAIL_RETENTION_MS) {
                              track.removeFirst();
                          }
                          aircraft.add(new Aircraft(id, callsign, lat, lon, altitude, speed, heading,
                                  seen, distance, current, Collections.unmodifiableList(new ArrayList<>(track))));
                      }
                      Iterator<Map.Entry<String, ArrayDeque<Fix>>> iter = history.entrySet().iterator();
                      while (iter.hasNext()) {
                          ArrayDeque<Fix> tracks = iter.next().getValue();
                          if (tracks.isEmpty() || now - tracks.peekLast().timeMs > TRAIL_RETENTION_MS) iter.remove();
                      }
                      Collections.sort(aircraft, new Comparator<Aircraft>() {
                          @Override public int compare(Aircraft a, Aircraft b) {
                              return Double.compare(a.distanceNm, b.distanceNm);
                          }
                      });
                      if (aircraft.size() > 50) aircraft = new ArrayList<>(aircraft.subList(0, 50));
                      snapshot = new Snapshot(Collections.unmodifiableList(aircraft), now, "LIVE");
                  } catch (Exception e) {
                      Snapshot old = snapshot;
                      String reason = e.getMessage() == null ? "UNAVAILABLE" : e.getMessage();
                      // Last known observations are retained but will never be labeled LIVE.
                      snapshot = new Snapshot(old.aircraft, old.retrievedAtMs,
                              "RATE LIMITED".equals(reason) ? "RATE LIMITED" : "UNAVAILABLE");
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }
          
              private static boolean valid(double v) { return !Double.isNaN(v) && !Double.isInfinite(v); }
              private static double distanceNm(double la1, double lo1, double la2, double lo2) {
                  double dLat = Math.toRadians(la2 - la1);
                  double dLon = Math.toRadians(lo2 - lo1);
                  double a = Math.pow(Math.sin(dLat / 2d), 2)
                          + Math.cos(Math.toRadians(la1)) * Math.cos(Math.toRadians(la2))
                          * Math.pow(Math.sin(dLon / 2d), 2);
                  return 3440.065d * 2d * Math.atan2(Math.sqrt(a), Math.sqrt(Math.max(0d, 1d - a)));
              }
          
              /** The radar is north-up, separate from the decorative rotating wallpaper globe. */
              void draw(Canvas c) {
                  if (c.getWidth() <= 0 || c.getHeight() <= 0) return;
                  Snapshot snap = snapshot;
                  long age = snap.retrievedAtMs == 0 ? Long.MAX_VALUE :
                          Math.max(0, System.currentTimeMillis() - snap.retrievedAtMs);
                  boolean live = "LIVE".equals(snap.status) && age <= STALE_MS;
                  boolean cached = !live && age <= MAX_CACHED_MS;
                  List<Aircraft> show = (live || cached) ? snap.aircraft : Collections.<Aircraft>emptyList();
                  String state = live ? "LIVE" : cached ? "CACHED" : snap.status;
          
                  float w = c.getWidth();
                  float left = 12f * dp;
                  float right = Math.min(w - left, left + 355f * dp);
                  float top = 12f * dp;
                  float bottom = top + 182f * dp;
                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.argb(214, 3, 15, 24));
                  c.drawRoundRect(left, top, right, bottom, 12f * dp, 12f * dp, paint);
                  paint.setColor(Color.argb(240, 62, 195, 226));
                  c.drawRoundRect(left, top, left + 3f * dp, bottom, 2f * dp, 2f * dp, paint);
                  float x = left + 13f * dp;
                  label(c, "AIRCRAFT INTELLIGENCE", x, top + 19f * dp, 12f, Color.rgb(178, 225, 242));
                  label(c, "KAMPALA  |  250 NM", x, top + 36f * dp, 9f, Color.rgb(152, 175, 193));
                  label(c, state + "  /  " + (live ? show.size() + " DISPLAYED" : "NOT LIVE"),
                          x, top + 54f * dp, 9f,
                          live ? Color.rgb(89, 220, 144) : Color.rgb(240, 184, 105));
          
                  float rx = right - 67f * dp;
                  float ry = top + 100f * dp;
                  float radius = 48f * dp;
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(dp);
                  paint.setColor(Color.argb(145, 88, 179, 205));
                  c.drawCircle(rx, ry, radius, paint);
                  c.drawCircle(rx, ry, radius / 2f, paint);
                  c.drawLine(rx - radius, ry, rx + radius, ry, paint);
                  c.drawLine(rx, ry - radius, rx, ry + radius, paint);
                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.rgb(88, 222, 167));
                  c.drawCircle(rx, ry, 2.5f * dp, paint); // Kampala centre
          
                  int visibleDots = 0;
                  for (Aircraft a : show) {
                      if (visibleDots++ >= 65) break;
                      for (int j = 1; j < a.trail.size(); j++) {
                          Fix p = a.trail.get(j - 1);
                          Fix q = a.trail.get(j);
                          float fromX = rx + p.nx * radius, fromY = ry - p.ny * radius;
                          float toX = rx + q.nx * radius, toY = ry - q.ny * radius;
                          paint.setStyle(Paint.Style.STROKE);
                          paint.setStrokeWidth(1.2f * dp);
                          paint.setColor(Color.argb(145, 73, 202, 234));
                          c.drawLine(fromX, fromY, toX, toY, paint);
                      }
                      float pointX = rx + a.position.nx * radius;
                      float pointY = ry - a.position.ny * radius;
                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(live ? Color.rgb(117, 235, 196) : Color.rgb(188, 161, 108));
                      c.drawCircle(pointX, pointY, 2.2f * dp, paint);
                      if (valid(a.headingDeg)) {
                          double hdg = Math.toRadians(a.headingDeg);
                          c.drawLine(pointX, pointY, pointX + (float) Math.sin(hdg) * 5f * dp,
                                  pointY - (float) Math.cos(hdg) * 5f * dp, paint);
                      }
                  }
                  int maxRows = Math.min(3, show.size());
                  for (int i = 0; i < maxRows; i++) {
                      Aircraft a = show.get(i);
                      String line1 = truncate(a.callsign, 10) + String.format(Locale.US,
                              "  %.0fS AGO", a.seenSeconds + Math.max(0, age) / 1000d);
                      label(c, line1, x, top + (83 + i * 29) * dp, 8.2f, Color.rgb(217, 237, 241));
                      label(c, String.format(Locale.US, "%s  %s  HDG %s",
                                      altitudeText(a.altitudeFt), speedText(a.speedKt), headingText(a.headingDeg)),
                              x, top + (96 + i * 29) * dp, 7f, Color.rgb(145, 178, 197));
                  }
                  if (maxRows == 0) {
                      label(c, live ? "NO REPORTS IN RANGE" : "WAITING FOR FEED", x,
                              top + 96f * dp, 8f, Color.rgb(180, 196, 205));
                  }
                  label(c, "SOURCE: ADSB.LOL  /  POSITIONS SUBJECT TO COVERAGE",
                          x, bottom - 8f * dp, 6.6f, Color.rgb(136, 155, 167));
              }
          
              private void label(Canvas canvas, String value, float x, float y, float size, int color) {
                  text.setTextSize(size * sp);
                  text.setColor(color);
                  canvas.drawText(value, x, y, text);
              }
              private static String truncate(String x, int n) { return x.length() <= n ? x : x.substring(0, n); }
              private static String altitudeText(double ft) {
                  return valid(ft) ? String.format(Locale.US, "%.0fFT", ft) : "ALT --";
              }
              private static String speedText(double kt) {
                  return valid(kt) ? String.format(Locale.US, "%.0fKT", kt) : "GS --";
              }
              private static String headingText(double deg) {
                  return valid(deg) ? String.format(Locale.US, "%03.0f", (deg + 360d) % 360d) : "---";
              }
          
              private static final class Fix {
                  final double lat, lon;
                  final float nx, ny; // Precomputed normalized radar position, zero allocations in draw loop
                  final long timeMs;
                  Fix(double lat, double lon, long timeMs) {
                      this.lat = lat; this.lon = lon; this.timeMs = timeMs;
                      double east = (lon - KAMPALA_LON) * 60d * Math.cos(Math.toRadians(KAMPALA_LAT)) / RADIUS_NM;
                      double north = (lat - KAMPALA_LAT) * 60d / RADIUS_NM;
                      double mag = Math.sqrt(east * east + north * north);
                      if (mag > 1d) { east /= mag; north /= mag; }
                      this.nx = (float) east;
                      this.ny = (float) north;
                  }
              }
              private static final class Aircraft {
                  final String id, callsign;
