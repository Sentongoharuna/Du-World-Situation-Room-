          pulse_path.write_text(pulse_xml, encoding='utf-8')
          ET.parse(pulse_path)
          pulse_info = res/'xml/rb_air_pulse_info.xml'
          info = pulse_info.read_text(encoding='utf-8')
          assert info.count('android:minHeight="105dp"') == 1
          assert info.count('android:minResizeHeight="100dp"') == 1
          info = info.replace('android:minHeight="105dp"', 'android:minHeight="145dp"', 1)
          info = info.replace('android:minResizeHeight="100dp"', 'android:minResizeHeight="140dp"', 1)
          pulse_info.write_text(info, encoding='utf-8')
          ET.parse(pulse_info)

          # Other detailed widget: use compact, readable flight rows instead of stretching them.
          command_path=res/'layout/rb_air_command.xml'
          command=command_path.read_text(encoding='utf-8')
          for n in (1,2,3):
              tag=f'android:id="@+id/rb_air_row{n}" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"'
              if command.count(tag)!=1: raise SystemExit(f'Command row {n} contract unexpectedly changed')
              command=command.replace(tag, f'android:id="@+id/rb_air_row{n}" android:layout_width="match_parent" android:layout_height="58dp"', 1)
          command=command.replace('android:text="NEAREST REPORTED FLIGHTS"', 'android:text="NEAREST AIRCRAFT · TAP FOR DETAILS"')
          assert 'AIRCRAFT COMMAND' in command
          command_path.write_text(command, encoding='utf-8')
          ET.parse(command_path)
          # Guard against XML elements whose ids the RemoteViews code expects.
          for path,ids in ((pulse_path, ['rb_air_pulse_refresh','rb_air_pulse_count','rb_air_pulse_moving',
                       'rb_air_pulse_ground','rb_air_pulse_row1','rb_air_pulse_row2',
                       'rb_air_pulse_call1','rb_air_pulse_stat1','rb_air_pulse_call2','rb_air_pulse_stat2',
                       'rb_air_pulse_extra','rb_air_pulse_metrics','rb_air_pulse_fix','rb_air_pulse_state']),
                       (command_path, ['rb_air_row1','rb_air_row2','rb_air_row3'])):
              xml=path.read_text(encoding='utf-8')
              for identifier in ids:
                  assert xml.count('@+id/'+identifier)==1, f'Missing/repeated widget id: {identifier}'
          live=(package/'DuwmLiveWallpaperService.java').read_text(encoding='utf-8')
          for invariant in ('FRAME_MS=33L','rotation=(rotation+(dt/1000.0d)*4.0d)%360.0d;',
                            'h.lockCanvas()', 'h.unlockCanvasAndPost(c)'):
              assert invariant in live, 'STOP: working globe rotation changed: '+invariant
          print('V3: responsive widgets, actual aircraft details, original live globe preserved')
          PY_WIDGET_POLISH

      - name: AIR COMMAND V4 - fact-based mini radar, freshness and responsive widgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY_AIR_V4'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import sys, re, textwrap
          root=Path(sys.argv[1])
          main=root/'app/src/main'
          pkg=main/'java/com/sentongoharuna/worldsituationroom'
          layout=main/'res/layout'
          widgets=pkg/'AirOperationsWidgets.java'
          source=widgets.read_text(encoding='utf-8')
          assert 'class Pulse extends AirOperationsWidgets' in source and 'class Command extends AirOperationsWidgets' in source
          assert 'private static final String FEED = "https://api.adsb.lol/v2/point/0.3476/32.5825/250"' in source
          assert 'private static final long MIN_RETRY_MS = 45_000L;' in source
          assert 'private static void renderAll(Context context)' in source
          
          def replace_once(old,new,label):
              global source
              count=source.count(old)
              if count!=1:raise ValueError(f'V4 FAIL CLOSED {label}: {count} matches')
              source=source.replace(old,new,1)
              print('V4 patch:',label)
          
          replace_once('import android.graphics.Color;', '''import android.graphics.Color;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Paint;''','isolated radar imports')
          replace_once('''            rv.setTextViewText(R.id.rb_air_command_provider,
                              error.isEmpty() ? "SOURCE  ADSB.LOL  •  REPORTS ONLY" : "SOURCE  " + error + "  •  LAST KNOWN");''','''            rv.setTextViewText(R.id.rb_air_command_provider,
                              error.isEmpty() ? "SOURCE ADSB.LOL  •  OBSERVED POSITIONS" : "SOURCE " + error + "  •  CACHED POSITIONS");
                      rv.setTextViewText(R.id.rb_air_command_age, ageLabel(age, stamp));
                      rv.setTextColor(R.id.rb_air_command_age, statusColor);
                      rv.setImageViewBitmap(R.id.rb_air_command_radar, radarImage(aircraft, stamp, count));
                      android.os.Bundle sizeOptions = manager.getAppWidgetOptions(id);
                      int availableHeight = Math.max(sizeOptions.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 0),
                                                     sizeOptions.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0));
                      rv.setViewVisibility(R.id.rb_air_command_radar, availableHeight >= 270 ? android.view.View.VISIBLE : android.view.View.GONE);
                      rv.setViewVisibility(R.id.rb_air_row2, availableHeight >= 285 ? android.view.View.VISIBLE : android.view.View.GONE);
                      rv.setViewVisibility(R.id.rb_air_row3, availableHeight >= 355 ? android.view.View.VISIBLE : android.view.View.GONE);''','command radar, data-age and height-aware flight rows')
          replace_once('''            rv.setTextViewText(R.id.rb_air_pulse_fix, when);''','''            rv.setTextViewText(R.id.rb_air_pulse_fix, ageLabel(age, stamp) + "  •  " + when);''','pulse data-age and time')
          replace_once('''                            + "  " + fmt(flight.optDouble("heading", Double.NaN), "°"));''','''                            + "  HDG " + fmt(flight.optDouble("heading", Double.NaN), "°"));''','explicit heading label')
          
          method=r'''    /** Snapshot age is calculated locally; no claim of continuous live tracking. */
              private static String ageLabel(long ageMs, long timestamp) {
                  if (timestamp <= 0L) return "NO DATA";
                  if (ageMs < 60_000L) return "AGE " + Math.max(0L, ageMs / 1000L) + "S";
                  if (ageMs < 3_600_000L) return "AGE " + ageMs / 60_000L + "M";
                  return "AGE " + ageMs / 3_600_000L + "H";
              }
          
              /** Real, finite provider positions only; snapshot radar never predicts tracks. */
              private static Bitmap radarImage(JSONArray flights, long timestamp, int total) {
                  final int width = 540, height = 148;
                  Bitmap bmp = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(bmp);
                  canvas.drawColor(Color.rgb(9, 22, 35));
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final float cx = 88f, cy = 74f, radius = 58f;
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(1.8f);
                  p.setColor(Color.argb(155, 49, 132, 160));
                  for (int ring=1; ring<=3; ring++) canvas.drawCircle(cx,cy,radius*ring/3f,p);
                  p.setColor(Color.argb(120, 45, 116, 146));
                  canvas.drawLine(cx-radius,cy,cx+radius,cy,p);
                  canvas.drawLine(cx,cy-radius,cx,cy+radius,p);
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(Color.rgb(97, 215, 238));
                  p.setTextSize(15f);
                  canvas.drawText("N",cx-6f,cy-radius-6f,p);
                  p.setColor(Color.rgb(75, 221, 171));
                  canvas.drawCircle(cx,cy,4f,p);
                  int plotted=0;
                  if (flights!=null && timestamp>0) for(int i=0; i<flights.length() && i<8; i++) {
                      JSONObject item=flights.optJSONObject(i);
                      if(item==null)continue;
                      double la=item.optDouble("lat",Double.NaN), lo=item.optDouble("lon",Double.NaN);
                      if(!finite(la) || !finite(lo))continue;
                      double north=(la-0.3476d)*60d;
                      double east=(lo-32.5825d)*60d*Math.cos(Math.toRadians(0.3476d));
                      double nm=Math.hypot(north,east);
                      if(nm>250d)continue;
                      p.setColor(item.optBoolean("ground",false)?Color.rgb(168,186,199):Color.rgb(88,222,190));
                      canvas.drawCircle(cx+(float)(east/250d*radius),cy-(float)(north/250d*radius),5f,p);
                      plotted++;
                  }
                  p.setColor(Color.rgb(101, 213, 236));p.setTextSize(19f);p.setFakeBoldText(true);
                  canvas.drawText("KAMPALA AIRSPACE",178f,38f,p);
                  p.setFakeBoldText(false);p.setTextSize(16f);p.setColor(Color.rgb(174,199,214));
                  canvas.drawText("250 NM  •  POSITION SNAPSHOT",178f,68f,p);
                  canvas.drawText(timestamp<=0?"AWAITING ADS-B REPORT":plotted+" PLOTTED / "+total+" REPORTED",178f,100f,p);
                  p.setTextSize(13f);p.setColor(Color.rgb(103,148,172));
                  canvas.drawText("NO PREDICTED AIRCRAFT MOVEMENT",178f,125f,p);
                  return bmp;
              }
          
          '''
          replace_once('    private static PendingIntent refreshIntent(',method+'    private static PendingIntent refreshIntent(','bitmap radar from observed data')
          widgets.write_text(source,encoding='utf-8')
          
          cmd=layout/'rb_air_command.xml'
          xml=cmd.read_text(encoding='utf-8')
          assert xml.count('android:id="@+id/rb_air_command_state"')==1
          assert xml.count('android:id="@+id/rb_air_command_fix"')==1
          # Use compact counts and more structured information with no fake movement.
          xml=xml.replace('android:layout_height="53dp"','android:layout_height="48dp"')
          xml=xml.replace('android:textSize="22sp"','android:textSize="23sp"')
          xml=xml.replace('android:text="NEAREST AIRCRAFT · TAP FOR DETAILS"','android:text="NEAREST REPORTED FLIGHTS  /  TAP TO INSPECT"')
          for ix in (1,2,3):
              xml=xml.replace(f'android:id="@+id/rb_air_row{ix}" android:layout_width="match_parent" android:layout_height="58dp"', f'android:id="@+id/rb_air_row{ix}" android:layout_width="match_parent" android:layout_height="49dp"')
          anchor=' <TextView android:text="NEAREST REPORTED FLIGHTS  /  TAP TO INSPECT"'
          assert xml.count(anchor)==1
          radar=''' <ImageView android:id="@+id/rb_air_command_radar" android:layout_width="match_parent"
             android:layout_height="82dp" android:layout_marginTop="6dp" android:visibility="gone"
             android:scaleType="fitXY" android:contentDescription="Observed aircraft positions in Kampala 250-nautical-mile radius"/>
           <TextView android:id="@+id/rb_air_command_age" android:layout_width="match_parent"
             android:layout_height="wrap_content" android:text="NO DATA" android:textColor="#65DDF3"
             android:textSize="9sp" android:textStyle="bold" android:gravity="end" android:layout_marginTop="4dp"/>
          '''
          xml=xml.replace(anchor,radar+anchor,1)
          cmd.write_text(xml,encoding='utf-8')
          info=main/'res/xml/rb_air_command_info.xml'
          s=info.read_text(encoding='utf-8')
          assert 'android:minHeight="245dp"' in s
          s=s.replace('android:minHeight="245dp"','android:minHeight="320dp"',1)
          info.write_text(s,encoding='utf-8')
          # Compact and readable footer, no invented activity or synthetic feeds
          pulse=layout/'rb_air_pulse.xml'
          s=pulse.read_text(encoding='utf-8')
          assert 'android:text="SOURCE ADSB.LOL · TAP FLIGHT"' in s
          s=s.replace('android:text="SOURCE ADSB.LOL · TAP FLIGHT"','android:text="ADSB.LOL · REPORTED POSITIONS ONLY"',1)
          pulse.write_text(s,encoding='utf-8')
          for path in (cmd,info,pulse): ET.parse(path)
          for identifier in ['rb_air_command_radar','rb_air_command_age','rb_air_row1','rb_air_row2','rb_air_row3']:
              assert xml.count('@+id/'+identifier)==1,identifier
          # No mutation of wallpaper, source ingestion, source attribution or provider list
          wallpaper=(pkg/'DuwmLiveWallpaperService.java').read_text(encoding='utf-8')
          for invariant in ('FRAME_MS=33L','rotation=(rotation+(dt/1000.0d)*4.0d)%360.0d;', 'h.lockCanvas()', 'h.unlockCanvasAndPost(c)'):
              assert invariant in wallpaper,'Globe motion base changed: '+invariant
          assert source.count('private static Bitmap radarImage(')==1
          assert source.count('getAppWidgetOptions(id)')>=2
          print('V4 verified: factual radar, aircraft rows, responsive status, original wallpaper preserved')
          PY_AIR_V4

