      - name: Enforce standalone native architecture
        shell: bash
        run: |
          set -euo pipefail
          source_root="$PROJECT_DIR/app/src"
          java_root="$source_root/main/java/com/sentongoharuna/worldsituationroom"
          fail_if_found() {
            local pattern="$1"
            local message="$2"
            if grep -R -nE "$pattern" "$source_root"; then
              echo "$message" >&2
              exit 1
            fi
          }
          require_file() {
            if [[ ! -s "$1" ]]; then
              echo "Required native source is missing: $1" >&2
              exit 1
            fi
          }
          require_text() {
            if ! grep -Fq -- "$2" "$1"; then
              echo "Required R17 feature is missing from $1: $2" >&2
              exit 1
            fi
          }

          fail_if_found 'import[[:space:]]+android\.webkit|new[[:space:]]+WebView' \
            'A WebView or browser wrapper was detected.'
          fail_if_found 'chatgpt\.site|github\.io/Sentongoharuna' \
            'A hosted application URL was detected.'
          if grep -nE 'implementation\(|api\(' "$PROJECT_DIR/app/build.gradle.kts"; then
            echo 'R17 must remain free of external runtime libraries.' >&2
            exit 1
          fi

          require_file "$java_root/MainActivity.java"
          require_file "$java_root/SatelliteMapView.java"
          require_file "$java_root/WorldDataRepository.java"
          require_file "$java_root/NativeMediaActivity.java"
          require_file "$java_root/NativeWebSocket.java"
          require_file "$java_root/SituationAnalyzer.java"
          require_file "$java_root/ReferenceCatalog.java"
          require_text "$java_root/MainActivity.java" 'GLOBAL INTELLIGENCE BRIEF / SOURCE-AWARE'
          require_text "$java_root/MainActivity.java" 'FOLLOW ON SATELLITE MAP'
          require_text "$java_root/MainActivity.java" 'SOURCE POSITION AGE'
          require_text "$java_root/SatelliteMapView.java" 'extends View'
          require_text "$java_root/SatelliteMapView.java" 'SHORT ESTIMATE ACTIVE'
          require_text "$java_root/SatelliteMapView.java" 'drawLabelTiles'
          require_text "$java_root/WorldDataRepository.java" 'NOAA_PLANETARY_K_INDEX'
          require_text "$java_root/WorldDataRepository.java" 'updateTrackingViewport'
          require_text "$java_root/AisStreamClient.java" 'NativeWebSocket'
          require_text "$java_root/AisStreamClient.java" 'BoundingBoxes'
          require_text "$java_root/NativeMediaActivity.java" 'VideoView'
          require_text "$java_root/NativeMediaActivity.java" 'ImageView'
          require_text "$java_root/SituationAnalyzer.java" 'correlations'
          require_text "$java_root/ReferenceCatalog.java" 'PUBLIC_SOURCE'
          require_text "$PROJECT_DIR/app/build.gradle.kts" 'compileSdk = 36'
          require_text "$PROJECT_DIR/app/build.gradle.kts" 'versionCode = 18'
          require_text "$PROJECT_DIR/app/build.gradle.kts" 'versionName = "17.0-2026-native-intelligence"'
          require_text "$source_root/main/AndroidManifest.xml" 'android:name=".NativeMediaActivity"'

          if grep -qE 'drawOperationalSweep|markerPhase' "$java_root/SatelliteMapView.java"; then
            echo 'Synthetic sweep or fake marker motion was detected.' >&2
            exit 1
          fi
          echo 'Standalone native R17 source guard passed.'

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Lint, compile and assemble native APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace --warning-mode all \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify and name installable APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          output_dir="$RUNNER_TEMP/world-situation-room-native-r17-apk"
          output_apk="$output_dir/World-Situation-Room-R17-Native-Live-Intelligence.apk"
          test -s "$source_apk"
          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_apk"
          test "$(find "$output_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(head -c 2 "$output_apk")" = 'PK'

          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$build_tools/aapt" dump badging "$output_apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.sentongoharuna.worldsituationroom' versionCode='18'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "sdkVersion:'23'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "targetSdkVersion:'35'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'World Situation Room'" "$RUNNER_TEMP/apk-badging.txt"
          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk"
          unzip -tq "$output_apk"

          while IFS= read -r dex; do
            if unzip -p "$output_apk" "$dex" | strings | grep -Ei \
              'android/webkit/WebView|okhttp3|okio/ByteString'; then
              echo "Forbidden browser or removed dependency found in $dex" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$output_apk" | grep -E '^classes[0-9]*\.dex$')

          apk_sha="$(sha256sum "$output_apk" | cut -d' ' -f1)"
          apk_size="$(du -h "$output_apk" | cut -f1)"
          {
            echo '## World Situation Room — Native Android R17'
            echo
            echo '- **APK:** World-Situation-Room-R17-Native-Live-Intelligence.apk'
            echo '- **Package:** com.sentongoharuna.worldsituationroom'
            echo "- **Size:** $apk_size"
            echo "- **SHA-256:** \`$apk_sha\`"
            echo '- **Architecture:** native Android Views, Canvas, TLS networking and media APIs; no WebView or hosted site'
            echo '- **Globe:** rotating global command view plus zoomable satellite/radar tracker and place labels'
            echo '- **Live telemetry:** OpenSky aircraft and optional AISStream vessels with source-fix age and capped estimates'
            echo '- **Events:** USGS, NASA EONET, NOAA SWPC, GDELT and configurable RSS with source-aware credibility labels'
            echo '- **Directories:** native pages for radio, public calls, television and public webcams'
            echo '- **Intelligence:** transparent provider health, density and cross-source correlation brief; no prediction or automatic confirmation'
            echo '- **Credentials:** optional keys stay encrypted on-device and are not compiled into the APK'
            echo '- **Minimum Android:** 6.0 (API 23)'
            echo '- **Distribution:** one raw APK artifact; no Pages deployment, website or ZIP wrapper'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/world-situation-room-native-r17-apk/World-Situation-Room-R17-Native-Live-Intelligence.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
