name: DEVELOP.UGANDA World Monitor R33 Safe APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/00-R33-SAFE-SMALL-APK.yml"
      - "world-situation-room-native-r30/**"

permissions:
  contents: read

concurrency:
  group: du-world-monitor-r33-safe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-android:
    name: Build R33 Safe Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            "world-situation-room-native-r30"
            "."
          )

          PROJECT_DIR=""
          for dir in "${candidates[@]}"; do
            if [[ -f "$dir/settings.gradle.kts" || -f "$dir/settings.gradle" ]]; then
              if [[ -f "$dir/app/build.gradle.kts" || -f "$dir/app/build.gradle" ]]; then
                PROJECT_DIR="$dir"
                break
              fi
            fi
          done

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Android source is not stored in the repository."
            echo "This SAFE workflow intentionally contains no embedded base64 source."
            echo "Expected project folder: world-situation-room-native-r30/"
            echo "Required: settings.gradle(.kts) and app/build.gradle(.kts)."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Verify source identity and R33 contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -d app/src/main
          test -f app/src/main/AndroidManifest.xml

          if [[ -f app/build.gradle.kts ]]; then
            grep -F 'com.sentongoharuna.worldsituationroom' app/build.gradle.kts >/dev/null || {
              echo "::error::Unexpected application package/source."
              exit 1
            }
          fi

          # Run available R33 verifiers without version-rewriting or source mutation.
          shopt -s nullglob
          verifiers=(scripts/verify-r33*.sh)
          if (( ${#verifiers[@]} )); then
            for verifier in "${verifiers[@]}"; do
              echo "Running $verifier"
              chmod +x "$verifier"
              "$verifier" "$(pwd)"
            done
          else
            echo "No R33 verifier scripts found; continuing with Gradle validation."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Clean lint compile and assemble
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ -x ./gradlew ]]; then
            ./gradlew --no-daemon clean :app:lintDebug :app:assembleDebug
          else
            gradle --no-daemon clean :app:lintDebug :app:assembleDebug
          fi

      - name: Find and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apks < <(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | sort)

          if (( ${#apks[@]} == 0 )); then
            echo "::error::Gradle completed but no APK was found."
            exit 1
          fi

          # Prefer debug APK generated by assembleDebug.
          APK=""
          for f in "${apks[@]}"; do
            if [[ "$f" == *"/debug/"* ]]; then
              APK="$f"
              break
            fi
          done
          [[ -n "$APK" ]] || APK="${apks[0]}"

          mkdir -p "$RUNNER_TEMP/du-r33-artifact"
          OUT="$RUNNER_TEMP/du-r33-artifact/DEVELOP-UGANDA-WORLD-MONITOR-R33.apk"
          cp "$APK" "$OUT"

          test -s "$OUT"
          sha256sum "$OUT"

          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -c%s "$OUT")" >> "$GITHUB_OUTPUT"

      - name: APK build summary
        shell: bash
        run: |
          {
            echo "## DEVELOP.UGANDA WORLD MONITOR — R33 SAFE BUILD"
            echo ""
            echo "- Source: repository checkout (no embedded base64 payload)"
            echo "- Java: 17"
            echo "- Gradle: 8.13"
            echo "- Android platform: 36"
            echo "- Build tools: 36.0.0"
            echo "- Validation: lintDebug + assembleDebug"
            echo "- APK: DEVELOP-UGANDA-WORLD-MONITOR-R33.apk"
            echo "- APK bytes: ${{ steps.apk.outputs.apk_size }}"
            echo ""
            echo "The workflow does not rewrite Java, versions, resources, or branding during CI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R33 APK
        uses: actions/upload-artifact@v4
        with:
          name: develop-uganda-world-monitor-R33-safe-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
