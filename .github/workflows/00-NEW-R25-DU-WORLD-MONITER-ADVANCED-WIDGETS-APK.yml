          DU_R25_NATIVE_SOURCE
          echo "650ce17b96b34e99222095723a94ff47a3539e292d72d7e6dfdef20705ae59a4  $archive" | sha256sum --check --strict -
          restore_root="$RUNNER_TEMP/world-situation-room-native-r25-source"
          mkdir -p "$restore_root"
          tar -xzf "$archive" -C "$restore_root"
          project_dir="$restore_root/world-situation-room-native-r25"
          test -s "$project_dir/settings.gradle.kts"
          test -s "$project_dir/app/src/main/AndroidManifest.xml"
          test -s "$project_dir/scripts/verify-r25-widget-contract.sh"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Enforce standalone native and eight-widget contract
        shell: bash
        run: |
          set -euo pipefail
          command -v rg >/dev/null
          chmod +x "$PROJECT_DIR/scripts/verify-r25-widget-contract.sh"
          "$PROJECT_DIR/scripts/verify-r25-widget-contract.sh"
          if rg -n 'android\.webkit\.WebView|<WebView|loadUrl\(|chatgpt\.site|github\.io/Sentongoharuna' "$PROJECT_DIR/app/src/main"; then
            echo 'Hosted-site or WebView code violates the standalone native contract.' >&2
            exit 1
          fi
          if rg -n '^[[:space:]]*(implementation|api)\(' "$PROJECT_DIR/app/build.gradle.kts"; then
            echo 'R25 must remain free of external runtime libraries.' >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Lint, compile and assemble R25 native APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --no-configuration-cache --stacktrace --warning-mode all \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify, inspect and name direct APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          output_dir="$RUNNER_TEMP/du-world-moniter-native-r25-apk"
          output_apk="$output_dir/du-world-moniter-R25-Advanced-Home-Intelligence.apk"
          test -s "$source_apk"
          ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            "$PROJECT_DIR/scripts/verify-r25-widget-contract.sh" "$source_apk"
          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_apk"
          test "$(find "$output_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(head -c 2 "$output_apk")" = 'PK'

          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$build_tools/aapt" dump badging "$output_apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          rg -F "package: name='com.sentongoharuna.worldsituationroom' versionCode='28' versionName='25.0-2026-home-intelligence'" "$RUNNER_TEMP/apk-badging.txt"
          rg -F "sdkVersion:'23'" "$RUNNER_TEMP/apk-badging.txt"
          rg -F "targetSdkVersion:'35'" "$RUNNER_TEMP/apk-badging.txt"
          rg -F "application-label:'du-world moniter'" "$RUNNER_TEMP/apk-badging.txt"
          rg -F "provides-component:'app-widget'" "$RUNNER_TEMP/apk-badging.txt"
          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk"
          unzip -tq "$output_apk"

          while IFS= read -r dex; do
            if unzip -p "$output_apk" "$dex" | strings | rg -i \
              'android/webkit/WebView|okhttp3|okio/ByteString'; then
              echo "Forbidden browser or removed dependency found in $dex" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$output_apk" | rg '^classes[0-9]*\.dex$')

          apk_sha="$(sha256sum "$output_apk" | cut -d' ' -f1)"
          apk_size="$(du -h "$output_apk" | cut -f1)"
          {
            echo '## du-world moniter — Native Android R25 Home Intelligence'
            echo
            echo '- **APK:** du-world-moniter-R25-Advanced-Home-Intelligence.apk'
            echo '- **Package:** com.sentongoharuna.worldsituationroom'
            echo "- **Size:** $apk_size"
            echo "- **SHA-256:** \`$apk_sha\`"
            echo '- **Architecture:** standalone native Android Views/Canvas/TLS/media; no WebView or hosted app'
            echo '- **Eight widgets:** Alert, Counters, Local, Wire, Air & Sea, Hazards & Weather, Media, Command Centre'
            echo '- **Profiles:** per-widget label, region, severity, broad distance lens and background-refresh choice'
            echo '- **Credibility:** source, acquisition age and UNVERIFIED/REPORTED/CONFIRMED state remain explicit'
            echo '- **Command widget:** UTC/local clocks, bounded globe snapshot, provider counts, health and top signals'
            echo '- **Refresh:** immediate shared cache, manual bounded acquisition and Android-batched periodic work'
            echo '- **Next upgrade:** visible Home Intelligence mission deck, one-tap pin request and page deep links'
            echo '- **Coverage:** provider-returned records only; AISStream/Windy remain optional keyed sources'
            echo '- **Minimum Android:** 6.0 (API 23)'
            echo '- **Distribution:** one direct APK artifact; no Pages site and no ZIP wrapper'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload direct R25 APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: du-world-moniter-R25-Advanced-Home-Intelligence-${{ github.run_number }}
          path: ${{ runner.temp }}/du-world-moniter-native-r25-apk/du-world-moniter-R25-Advanced-Home-Intelligence.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
