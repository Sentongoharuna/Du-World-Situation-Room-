      - name: Restore R32 source payload 2 of 5
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/du-r32-source.b64" <<'DU_R32_CHUNK'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          DU_R32_CHUNK

      - name: Restore R32 source payload 3 of 5
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/du-r32-source.b64" <<'DU_R32_CHUNK'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          DU_R32_CHUNK

      - name: Restore R32 source payload 4 of 5
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/du-r32-source.b64" <<'DU_R32_CHUNK'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          DU_R32_CHUNK

      - name: Restore R32 source payload 5 of 5
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/du-r32-source.b64" <<'DU_R32_CHUNK'
          
          
          
          
          
          
          
          DU_R32_CHUNK

      - name: Decode verify and restore R32 native source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/du-r32-source.tar.gz"
          base64 --decode "$RUNNER_TEMP/du-r32-source.b64" > "$archive"
          echo "be81df4a036bb862dc05f587caa300b4a9cd3f0caed103208e97c088241f2a11  $archive" | sha256sum -c -
          gzip -t "$archive"
          tar -tzf "$archive" >/dev/null
          tar -xzf "$archive" -C .
      - name: Normalize restored source to R32 version contract
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find . -maxdepth 4 -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$BUILD_FILE"
          sed -E -i 's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 32/' "$BUILD_FILE"
          sed -E -i 's/versionName[[:space:]]*=[[:space:]]*"[^"]+"/versionName = "32.0-2026-brand"/' "$BUILD_FILE"
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*32' "$BUILD_FILE"
          echo "R32 version contract normalized before legacy verification"

      - name: Run source-safe restored verification scripts
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find . -maxdepth 4 -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          if [ -d "$PROJECT_DIR/scripts" ]; then
            find "$PROJECT_DIR/scripts" -maxdepth 1 -type f -name 'verify-*.sh' -print0 | while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              case "$base" in
                verify-r21-*|verify-r22-*|verify-r23-*|verify-r24-*|verify-r25-*|verify-r26-*|verify-r27-*|verify-r28-*|verify-r29-*|verify-r30-*|verify-r31-*)
                  echo "Deferring historical/APK-dependent verifier: $base"
                  continue
                  ;;
              esac
              echo "Running source-safe verifier: $f"
              chmod +x "$f"
              "$f" "$PROJECT_DIR"
            done
          fi
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*32' "$PROJECT_DIR/app/build.gradle.kts"
          echo "R32 source contract confirmed"

      - name: Install transparent DEVELOP.UGANDA logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          cat > "$RUNNER_TEMP/du-logo.b64" <<'DU_LOGO'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          DU_LOGO
          base64 --decode "$RUNNER_TEMP/du-logo.b64" > app/src/main/res/drawable-nodpi/du_develop_uganda_logo.png

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Repair all observed transport-corrupted Java tokens
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find . -maxdepth 4 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          JAVA_ROOT="$PROJECT_DIR/app/src/main/java"
          python3 - "$JAVA_ROOT" <<'PY'
          import pathlib,re,sys
          root=pathlib.Path(sys.argv[1])
          for p in root.rglob("*.java"):
              x=p.read_text(); y=x
              y=y.replace("}0","")
              y=re.sub(r"(?<=[A-Za-z_])0(?=[A-Z])","",y)
              fixes={
                "intMaximum":"int maximum","intMinimum":"int minimum","intTop":"int top","intRead":"int read",
                "intMAX_REPORTS":"int MAX_REPORTS","intMAX_COMMENTS_PER_REPORT":"int MAX_COMMENTS_PER_REPORT",
                "intMAX_TRACKS":"int MAX_TRACKS","ImageViewimage":"ImageView image","ImageViewImage":"ImageView image",
                "Viewfallback":"View fallback","RuntimeExceptionerror":"RuntimeException error","BriefshareBrief":"Brief shareBrief"
              }
              for old,new in fixes.items(): y=y.replace(old,new)
              if y!=x: p.write_text(y); print("repaired",p)
          PY
          if grep -RInE '\}0|\bint(Maximum|Minimum|Top|Read|MAX_)|ImageView(image|Image)|Viewfallback|RuntimeExceptionerror|BriefshareBrief' "$JAVA_ROOT" --include='*.java'; then
            echo "Known transport corruption remains"
            exit 1
          fi

      - name: Lint, compile and assemble R32 native APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find . -maxdepth 4 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || { echo "Gradle project root not found"; exit 1; }
          echo "Building Android project from $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon --no-configuration-cache --stacktrace --warning-mode all \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify, inspect and name direct R32 APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find . -maxdepth 4 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          source_apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          output_dir="$RUNNER_TEMP/du-world-moniter-native-r32-apk"
          output_apk="$output_dir/du-world-moniter-R32-Crash-Repair-Brand.apk"
          test -s "$source_apk"
          ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            if [ -x "$PROJECT_DIR/scripts/verify-r32-crash-repair-brand.sh" ]; then
            "$PROJECT_DIR/scripts/verify-r32-crash-repair-brand.sh"
          fi "$source_apk"
          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_apk"
          test "$(find "$output_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(head -c 2 "$output_apk")" = 'PK'

          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$build_tools/aapt" dump badging "$output_apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.sentongoharuna.worldsituationroom' versionCode='33' versionName='30.0-2026-crash-repair-brand'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "sdkVersion:'23'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "targetSdkVersion:'35'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'DU World Monitor'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "provides-component:'app-widget'" "$RUNNER_TEMP/apk-badging.txt"
          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk"
          unzip -tq "$output_apk"

          while IFS= read -r dex; do
            if unzip -p "$output_apk" "$dex" | strings | grep -Ei \
              'android/webkit/WebView|okhttp3|okio/ByteString'; then
              echo "Forbidden browser or removed dependency found in $dex" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$output_apk" | grep -E '^classes[0-9]*\.dex$')

          apk_sha="$(sha256sum "$output_apk" | cut -d' ' -f1)"
          apk_size="$(du -h "$output_apk" | cut -f1)"
          {
            echo '## DU World Monitor — Native Android R32 Crash Repair + Brand'
            echo
            echo '- **APK:** du-world-moniter-R32-Crash-Repair-Brand.apk'
            echo '- **Package:** com.sentongoharuna.worldsituationroom'
            echo "- **Size:** $apk_size"
            echo "- **SHA-256:** \`$apk_sha\`"
            echo '- **R27 preserved:** globe, public-source layers, replay, analysis and eight live-motion widgets'
            echo '- **Crash repair:** local crash references, automatic recovery mode and isolated live-feed UI boundaries'
            echo '- **Safe media:** a suspected Local Monitor media crash reopens report details without autoplay'
            echo '- **Media lifecycle:** stale MediaPlayer callbacks cannot control a newer story after navigation'
            echo '- **Memory:** bounded avatar decoding plus a 4 MiB in-memory cache and initials fallback'
            echo '- **Upgrade safety:** wrong-type preferences from older builds are migrated without ClassCast crashes'
            echo '- **Brand:** adaptive DU/globe launcher icon, unified wordmark and marketing-ready share cards'
            echo '- **Promise:** See the world. Hear the local witness.'
            echo '- **Entry:** MONITORS is the second globe mission-dock action'
            echo '- **Full-screen feed:** native centre-crop FILL plus FIT mode; no permanent black action column'
            echo '- **Gestures:** animated vertical swipe, tap pause, double-tap like and press-hold mute'
            echo '- **Profiles:** real local profile photos plus bounded HTTPS remote avatars, follow and block controls'
            echo '- **Reports:** timed recording choices, import, headline, caption, safety-aware location and private drafts'
            echo '- **Comments:** native bottom panel with local-first posting and explicit non-verification warning'
            echo '- **Stories:** progress bars, automatic next report and optional 24-hour expiry'
            echo '- **Globe:** recognised locations and permitted coordinates become labelled report markers; drafts never do'
            echo '- **Truth:** every new report starts UNVERIFIED; profile status and report credibility remain separate'
            echo '- **Offline safety:** local video, drafts and upload offsets survive missing service or interruption'
            echo '- **Cross-device service:** configurable HTTPS R32 API, resumable uploads and Keystore-encrypted tokens'
            echo '- **Live:** server-created publisher/playback sessions; recorded clips are never falsely marked live'
            echo '- **Privacy:** location permission is optional; manual location reporting remains available'
            echo '- **Architecture:** standalone native Android Views/media/HTTPS; no WebView or external runtime library'
            echo '- **Minimum Android:** 6.0 (API 23)'
            echo '- **Distribution:** one direct APK artifact; no Pages site and no ZIP wrapper'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload direct R32 APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: du-world-moniter-R32-Crash-Repair-Brand-${{ github.run_number }}
          path: ${{ runner.temp }}/du-world-moniter-native-r32-apk/du-world-moniter-R32-Crash-Repair-Brand.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
