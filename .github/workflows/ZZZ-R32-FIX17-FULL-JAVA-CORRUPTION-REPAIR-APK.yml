name: ZZZ R32 FIX17 - FULL JAVA CORRUPTION REPAIR APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ZZZ-R32-FIX17-FULL-JAVA-CORRUPTION-REPAIR-APK.yml"

permissions:
  contents: read

concurrency:
  group: du-world-moniter-native-r32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-android:
    name: Build R32 native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Prepare R32 source restore
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/du-r32-source.b64"

      - name: Restore R32 source payload 1 of 5
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/du-r32-source.b64" <<'DU_R32_CHUNK'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
