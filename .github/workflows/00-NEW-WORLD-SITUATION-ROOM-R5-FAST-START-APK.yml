          Po/P4/P4PD6Pz+Pz+Dw+j8/v+vz/tfur+wD4AgA=
          WSR_NATIVE_SOURCE
          echo "1207c7f0446fa86a4eb4d9e15446206cc39ede97c32f6f427fff8e46cc77c710  $archive" | sha256sum --check -
          restore_root="$RUNNER_TEMP/world-situation-room-native-r5-source"
          mkdir -p "$restore_root"
          tar -xzf "$archive" -C "$restore_root"
          project_dir="$restore_root/world-situation-room-native-r5"
          test -f "$project_dir/settings.gradle.kts"
          test -f "$project_dir/app/src/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Enforce native-only application architecture
        shell: bash
        run: |
          set -euo pipefail
          source_root="$PROJECT_DIR/app/src"
          if grep -R -nE 'import[[:space:]]+android\.webkit|new[[:space:]]+WebView' "$source_root"; then
            echo "A browser wrapper was detected. This workflow only builds the native app." >&2
            exit 1
          fi
          if grep -R -n 'chatgpt\.site' "$source_root"; then
            echo "A ChatGPT Site URL was detected. This native build must stand alone." >&2
            exit 1
          fi
          grep -q 'extends View' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          grep -q 'WorldDataRepository' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'import okio.ByteString;' "$source_root/main/java/com/sentongoharuna/worldsituationroom/AisStreamClient.java"
          grep -q 'NATIVE MAP READY' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          grep -q 'prioritizeViewport' "$source_root/main/java/com/sentongoharuna/worldsituationroom/TileStore.java"
          if grep -q 'import okhttp3.ByteString;' "$source_root/main/java/com/sentongoharuna/worldsituationroom/AisStreamClient.java"; then
            echo "Wrong OkHttp ByteString package detected." >&2
            exit 1
          fi
          grep -q 'com.sentongoharuna.worldsituationroom' "$PROJECT_DIR/app/build.gradle.kts"
          echo "Native-only source guard passed."

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Compile, lint and assemble native APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace --warning-mode all \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify and name installable APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          output_dir="$RUNNER_TEMP/world-situation-room-native-r5-apk"
          output_apk="$output_dir/World-Situation-Room-NATIVE-R5-FAST.apk"
          test -s "$source_apk"
          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_apk"
          aapt_bin="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$aapt_bin" dump badging "$output_apk" | grep -F "package: name='com.sentongoharuna.worldsituationroom'"
          "$aapt_bin" dump badging "$output_apk" | grep -F "application-label:'World Situation Room'"
          unzip -tq "$output_apk"
          apk_sha="$(sha256sum "$output_apk" | cut -d' ' -f1)"
          apk_size="$(du -h "$output_apk" | cut -f1)"
          {
            echo "## World Situation Room — Native Android R5 Fast Start"
            echo
            echo "- **APK:** World-Situation-Room-NATIVE-R5-FAST.apk"
            echo "- **Package:** com.sentongoharuna.worldsituationroom"
            echo "- **Size:** $apk_size"
            echo "- **SHA-256:** \`$apk_sha\`"
            echo "- **Architecture:** native Android Views + Canvas map; no WebView or site URL"
            echo "- **Minimum Android:** 6.0 (API 23)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/world-situation-room-native-r5-apk/World-Situation-Room-NATIVE-R5-FAST.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
