          DU_R32_CHUNK

      - name: Restore R32 source payload 2 of 4
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/du-r32-source.b64" <<'DU_R32_CHUNK'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
