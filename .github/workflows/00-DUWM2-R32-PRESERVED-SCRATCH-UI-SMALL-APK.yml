name: DUWM2 R32 PRESERVED SCRATCH UI SMALL APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/00-DUWM2-R32-PRESERVED-SCRATCH-UI-SMALL-APK.yml"
      - "DUWM2-R32-PRESERVED-SCRATCH-UI-SOURCE.tar.gz"

permissions:
  contents: read

concurrency:
  group: duwm2-80-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract DUWM2 source
        shell: bash
        run: |
          set -euo pipefail
          test -s DUWM2-R32-PRESERVED-SCRATCH-UI-SOURCE.tar.gz
          echo "b796bdb921a3038fd4386a24108041f6a8848b9443901b5d51140e028dfbe6c5  DUWM2-R32-PRESERVED-SCRATCH-UI-SOURCE.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/duwm2"
          tar -xzf DUWM2-R32-PRESERVED-SCRATCH-UI-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm2"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm2" >> "$GITHUB_ENV"
          test -f "$RUNNER_TEMP/duwm2/app/build.gradle.kts"
          test -f "$RUNNER_TEMP/duwm2/app/src/main/AndroidManifest.xml"

      - name: Verify DUWM2 lineage
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          for v in scripts/verify-r33-local-news.sh scripts/verify-r33-safe-logo-upgrade.sh scripts/verify-r33-upgrade9-intelligence-suite.sh; do
            chmod +x "$v"
            "$v" "$PROJECT_DIR"
          done
          test -s docs/DUWM2-80-PERCENT-PRODUCT-CONTRACT.md

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 36 from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -x "$SDK/build-tools/36.0.0/apksigner"
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Lint compile assemble
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -x ./gradlew ]]; then
            ./gradlew --no-daemon clean :app:lintDebug :app:assembleDebug
          else
            gradle --no-daemon clean :app:lintDebug :app:assembleDebug
          fi

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$RUNNER_TEMP/artifact"
          OUT="$RUNNER_TEMP/artifact/DUWM2-80-UI.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload DUWM2 APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM2-80-UI-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
