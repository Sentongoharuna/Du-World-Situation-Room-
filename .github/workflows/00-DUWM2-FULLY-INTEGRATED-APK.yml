name: DUWM2 FULLY INTEGRATED APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/00-DUWM2-FULLY-INTEGRATED-APK.yml"
      - "DUWM2-FULLY-INTEGRATED-SOURCE.tar.gz"

permissions:
  contents: read

concurrency:
  group: duwm2-80-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract DUWM2 source
        shell: bash
        run: |
          set -euo pipefail
          test -s DUWM2-FULLY-INTEGRATED-SOURCE.tar.gz
          echo "ebf21a9e081792280cb10b99bc5d226110bb3c45b074063fbf1c8fa710f624f6  DUWM2-FULLY-INTEGRATED-SOURCE.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/duwm2"
          tar -xzf DUWM2-FULLY-INTEGRATED-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm2"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm2" >> "$GITHUB_ENV"
          test -f "$RUNNER_TEMP/duwm2/app/build.gradle.kts"
          test -f "$RUNNER_TEMP/duwm2/app/src/main/AndroidManifest.xml"

      - name: Verify preserved R31 R32 baseline and DUWM2 scratch UI
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          PKG="app/src/main/java/com/sentongoharuna/worldsituationroom"
          for f in Du2Ui.java Du2Nav.java Du2Home.java Du2News.java Du2Monitors.java Du2More.java Du2Detail.java; do
            test -s "$PKG/$f"
          done

          # Preserve the original World Monitor / Source Index / globe foundation.
          grep -R -F "LIVE SOURCE INDEX" "$PKG" >/dev/null
          grep -R -F "SHARE THIS PAGE AS CARD" "$PKG" >/dev/null
          grep -R -F "GLOBE" "$PKG" >/dev/null

          # New navigation must have distinct HOME NEWS MONITORS MORE destinations.
          grep -F "Du2Home.class" "$PKG/Du2Nav.java" >/dev/null
          grep -F "Du2News.class" "$PKG/Du2Nav.java" >/dev/null
          grep -F "Du2Monitors.class" "$PKG/Du2Nav.java" >/dev/null
          grep -F "Du2More.class" "$PKG/Du2Nav.java" >/dev/null

          # MAP is the explicit primary globe route.
          grep -F 'putExtra("du_route","GLOBE")' "$PKG/Du2Nav.java" >/dev/null

          # Confirm the new DUWM2 launcher exists.
          grep -F 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml >/dev/null

          echo "PRESERVED R31/R32 FOUNDATION + DUWM2 SCRATCH UI CONTRACT PASS"

      - name: Verify DUWM2 general UI contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-general-ui.sh
          scripts/verify-duwm2-general-ui.sh "$PROJECT_DIR"

      - name: Verify living intelligence upgrades
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-living-intelligence.sh
          scripts/verify-duwm2-living-intelligence.sh "$PROJECT_DIR"

      - name: Verify DUWM2 solutions pack
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-solutions-pack.sh
          scripts/verify-duwm2-solutions-pack.sh "$PROJECT_DIR"

      - name: Verify interface max upgrades
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-interface-max.sh
          scripts/verify-duwm2-interface-max.sh "$PROJECT_DIR"

      - name: Verify functional solutions
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-functional-solutions.sh
          scripts/verify-duwm2-functional-solutions.sh "$PROJECT_DIR"

      - name: Verify integrated toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-integrated-toolchain.sh
          scripts/verify-duwm2-integrated-toolchain.sh "$PROJECT_DIR"

      - name: Verify dedicated pages and routing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-dedicated-pages.sh
          scripts/verify-duwm2-dedicated-pages.sh "$PROJECT_DIR"

      - name: Verify chronological navigation
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-chronological-nav.sh
          scripts/verify-duwm2-chronological-nav.sh "$PROJECT_DIR"

      - name: Verify professional interface
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-pro-look.sh
          scripts/verify-duwm2-pro-look.sh "$PROJECT_DIR"

      - name: Verify visual data engine
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-visual-data-engine.sh
          scripts/verify-duwm2-visual-data-engine.sh "$PROJECT_DIR"

      - name: Verify live product solutions
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-live-product.sh
          scripts/verify-duwm2-live-product.sh "$PROJECT_DIR"

      - name: Verify detailed implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-detailed-implementation.sh
          scripts/verify-duwm2-detailed-implementation.sh "$PROJECT_DIR"

      - name: Verify completion framework
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-completion-framework.sh
          scripts/verify-duwm2-completion-framework.sh "$PROJECT_DIR"

      - name: Verify full DUWM2 integration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-full-integration.sh
          scripts/verify-duwm2-full-integration.sh "$PROJECT_DIR"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 36 from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -x "$SDK/build-tools/36.0.0/apksigner"
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Lint compile assemble
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -x ./gradlew ]]; then
            ./gradlew --no-daemon clean :app:lintDebug :app:assembleDebug
          else
            gradle --no-daemon clean :app:lintDebug :app:assembleDebug
          fi

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$RUNNER_TEMP/artifact"
          OUT="$RUNNER_TEMP/artifact/DUWM2-80-UI.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload DUWM2 APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM2-80-UI-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
