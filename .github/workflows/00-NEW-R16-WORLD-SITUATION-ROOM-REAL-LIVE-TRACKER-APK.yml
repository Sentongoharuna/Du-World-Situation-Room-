      - name: Enforce native-only application architecture
        shell: bash
        run: |
          set -euo pipefail
          source_root="$PROJECT_DIR/app/src"
          if grep -R -nE 'import[[:space:]]+android\.webkit|new[[:space:]]+WebView' "$source_root"; then
            echo "A browser wrapper was detected. This workflow only builds the native app." >&2
            exit 1
          fi
          if grep -R -n 'chatgpt\.site' "$source_root"; then
            echo "A ChatGPT Site URL was detected. This native build must stand alone." >&2
            exit 1
          fi
          require_file() {
            if [[ ! -s "$1" ]]; then
              echo "Required native source is missing: $1" >&2
              exit 1
            fi
          }
          require_text() {
            if ! grep -Fq -- "$2" "$1"; then
              echo "Required native feature is missing from $1: $2" >&2
              exit 1
            fi
          }
          java_root="$source_root/main/java/com/sentongoharuna/worldsituationroom"
          require_file "$java_root/MainActivity.java"
          require_file "$java_root/SatelliteMapView.java"
          require_file "$java_root/WorldDataRepository.java"
          require_file "$java_root/NativeMediaActivity.java"
          require_file "$source_root/main/AndroidManifest.xml"
          require_text "$java_root/MainActivity.java" 'CATALOG_CATEGORIES'
          require_text "$java_root/MainActivity.java" 'FOLLOW ON SATELLITE MAP'
          require_text "$java_root/MainActivity.java" 'SOURCE POSITION AGE'
          require_text "$java_root/SatelliteMapView.java" 'extends View'
          require_text "$java_root/SatelliteMapView.java" 'followSignal'
          require_text "$java_root/SatelliteMapView.java" 'displayPosition'
          require_text "$java_root/SatelliteMapView.java" 'SHORT ESTIMATE ACTIVE'
          require_text "$java_root/SatelliteMapView.java" 'drawLabelTiles'
          require_text "$java_root/WorldDataRepository.java" 'updateTrackingViewport'
          require_text "$java_root/WorldDataRepository.java" 'openSkySectorUrl'
          require_text "$java_root/WorldDataRepository.java" 'openSkyCreditCost'
          require_text "$java_root/AisStreamClient.java" 'updateViewport'
          require_text "$java_root/AisStreamClient.java" 'BoundingBoxes'
          require_text "$java_root/Signal.java" 'speedMetersPerSecond'
          require_text "$java_root/NativeMediaActivity.java" 'VideoView'
          require_text "$java_root/NativeMediaActivity.java" 'ImageView'
          require_text "$java_root/AppConfig.java" 'IPTV_CHANNELS'
          require_text "$java_root/AppConfig.java" 'LABEL_TILES'
          require_text "$java_root/AisStreamClient.java" 'import okio.ByteString;'
          require_text "$source_root/main/AndroidManifest.xml" 'android:name=".NativeMediaActivity"'
          if grep -q 'import okhttp3.ByteString;' "$source_root/main/java/com/sentongoharuna/worldsituationroom/AisStreamClient.java"; then
            echo "Wrong OkHttp ByteString package detected." >&2
            exit 1
          fi
          if grep -qE 'drawOperationalSweep|markerPhase' "$java_root/SatelliteMapView.java"; then
            echo "Synthetic sweep or fake marker animation detected." >&2
            exit 1
          fi
          require_text "$PROJECT_DIR/app/build.gradle.kts" 'com.sentongoharuna.worldsituationroom'
          require_text "$PROJECT_DIR/app/build.gradle.kts" 'versionCode = 16'
          require_text "$PROJECT_DIR/app/build.gradle.kts" 'versionName = "16.0-2026-real-live-tracker"'
          echo "Native-only source guard passed. Structural checks only; Android lint and compilation follow."

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Compile, lint and assemble native APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace --warning-mode all \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify and name installable APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          output_dir="$RUNNER_TEMP/world-situation-room-native-r16-apk"
          output_apk="$output_dir/World-Situation-Room-R16-Real-Live-Tracker.apk"
          test -s "$source_apk"
          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_apk"
          test "$(find "$output_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          test "${output_apk##*.}" = "apk"
          test "$(head -c 2 "$output_apk")" = "PK"
          aapt_bin="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$aapt_bin" dump badging "$output_apk" | grep -F "package: name='com.sentongoharuna.worldsituationroom'"
          "$aapt_bin" dump badging "$output_apk" | grep -F "application-label:'World Situation Room'"
          unzip -tq "$output_apk"
          apk_sha="$(sha256sum "$output_apk" | cut -d' ' -f1)"
          apk_size="$(du -h "$output_apk" | cut -f1)"
          {
            echo "## World Situation Room — Native Android R16 Real Live Tracker"
            echo
            echo "- **APK:** World-Situation-Room-R16-Real-Live-Tracker.apk"
            echo "- **Package:** com.sentongoharuna.worldsituationroom"
            echo "- **Size:** $apk_size"
            echo "- **SHA-256:** \`$apk_sha\`"
            echo "- **Architecture:** native Android Views + Canvas globe/satellite tracker; no WebView or site URL"
            echo "- **Detailed map:** pinch, double-tap, search or TRACK opens zoomable satellite tiles with transparent place labels"
            echo "- **Aircraft:** real OpenSky provider positions, viewport-aware credit budgeting and source-fix age"
            echo "- **Vessels:** live AISStream WebSocket positions with visible-sector subscription replacement"
            echo "- **Motion:** speed/course dead reckoning is capped at 60s for aircraft and 120s for vessels, and visibly linked to the source fix"
            echo "- **Signals:** event-driven green/amber/red lights with independent finite pulse rhythms"
            echo "- **Presentation:** no boxed side rails; live words and figures float at the globe edges"
            echo "- **2026 UI:** translucent rounded surfaces, modern type hierarchy, hairline borders and touch ripples"
            echo "- **Cameras:** provider-permitted worldwide Windy camera atlas with paged caching and graceful partial results"
            echo "- **Source pages:** aircraft, ships, boats, weather, events, categorized news, radio, calls/frequencies, TV and cameras"
            echo "- **Native media:** direct public radio, TV and camera media opens inside Android views; no media website wrapper"
            echo "- **Safety:** cleartext, metadata-less, closed, NSFW and provider-blocklisted TV entries are excluded"
            echo "- **Distribution:** one raw APK; no Pages deployment, website, or ZIP wrapper"
            echo "- **Minimum Android:** 6.0 (API 23)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/world-situation-room-native-r16-apk/World-Situation-Room-R16-Real-Live-Tracker.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
