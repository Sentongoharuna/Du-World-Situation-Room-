name: DUWM2 FULLY INTEGRATED FIX1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/00-DUWM2-FULLY-INTEGRATED-FIX1-APK.yml"
      - "DUWM2-FULLY-INTEGRATED-FIX1-SOURCE.tar.gz"

permissions:
  contents: read

concurrency:
  group: duwm2-integrated-fix1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract current integrated source
        shell: bash
        run: |
          set -euo pipefail
          test -s DUWM2-FULLY-INTEGRATED-FIX1-SOURCE.tar.gz
          echo "7dbc5138a7f177db9f0189397eb4a9a106d60f701ff32646725b68ac86076473  DUWM2-FULLY-INTEGRATED-FIX1-SOURCE.tar.gz" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/duwm2"
          mkdir -p "$RUNNER_TEMP/duwm2"
          tar -xzf DUWM2-FULLY-INTEGRATED-FIX1-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm2"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm2" >> "$GITHUB_ENV"

      - name: Verify current integrated app only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-current-build.sh
          scripts/verify-duwm2-current-build.sh "$PROJECT_DIR"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 36 tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean lint compile assemble
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" -type f | head -1)
          test -n "$APK"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/DUWM2-FULLY-INTEGRATED-FIX1.apk"
          ls -lh "$RUNNER_TEMP/DUWM2-FULLY-INTEGRATED-FIX1.apk"

      - name: Upload DUWM2 APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM2-FULLY-INTEGRATED-FIX1-APK
          path: ${{ runner.temp }}/DUWM2-FULLY-INTEGRATED-FIX1.apk
          if-no-files-found: error
          retention-days: 14
