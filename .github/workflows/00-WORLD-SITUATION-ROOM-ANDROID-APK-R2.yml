      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Compile Android application
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Prepare the installable APK
        id: package
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="${RUNNER_TEMP}/world-situation-room-apk"
          OUTPUT_APK="${OUTPUT_DIR}/World-Situation-Room-R2.apk"
          SOURCE_APK="${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

          mkdir -p "${OUTPUT_DIR}"
          install -m 0644 "${SOURCE_APK}" "${OUTPUT_APK}"
          test -s "${OUTPUT_APK}"

          APK_SHA256="$(sha256sum "${OUTPUT_APK}" | awk '{print $1}')"
          APK_SIZE="$(du -h "${OUTPUT_APK}" | awk '{print $1}')"
          {
            echo "## Android APK ready"
            echo
            echo "- File: World-Situation-Room-R2.apk"
            echo "- Package: com.sentongoharuna.worldsituationroom"
            echo "- Version: 2.0 (2)"
            echo "- Minimum Android: 6.0 (API 23)"
            echo "- Size: ${APK_SIZE}"
            echo "- SHA-256: ${APK_SHA256}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/world-situation-room-apk/World-Situation-Room-R2.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
