name: WORLD SITUATION ROOM - ANDROID APK R2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/00-WORLD-SITUATION-ROOM-ANDROID-APK-R2.yml"

permissions:
  contents: read

concurrency:
  group: world-situation-room-android-r2-${{ github.ref }}
  cancel-in-progress: true

