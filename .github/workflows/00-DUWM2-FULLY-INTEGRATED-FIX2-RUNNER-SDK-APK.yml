name: DUWM2 FULLY INTEGRATED FIX2 RUNNER SDK APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/00-DUWM2-FULLY-INTEGRATED-FIX2-RUNNER-SDK-APK.yml"
      - "DUWM2-FULLY-INTEGRATED-FIX1-SOURCE.tar.gz"

permissions:
  contents: read

concurrency:
  group: duwm2-fix2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract integrated source
        shell: bash
        run: |
          set -euo pipefail
          test -s DUWM2-FULLY-INTEGRATED-FIX1-SOURCE.tar.gz
          echo "7dbc5138a7f177db9f0189397eb4a9a106d60f701ff32646725b68ac86076473  DUWM2-FULLY-INTEGRATED-FIX1-SOURCE.tar.gz" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/duwm2"
          mkdir -p "$RUNNER_TEMP/duwm2"
          tar -xzf DUWM2-FULLY-INTEGRATED-FIX1-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm2"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm2" >> "$GITHUB_ENV"

      - name: Verify current integrated app
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/verify-duwm2-current-build.sh
          scripts/verify-duwm2-current-build.sh "$PROJECT_DIR"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "Using runner SDK: $SDK"
          ls -la "$SDK/platforms" | tail -30 || true
          ls -la "$SDK/build-tools" | tail -30 || true

      - name: Verify Android 36 from runner
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          if [ -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ]; then
            echo "BUILD_TOOLS=36.0.0" >> "$GITHUB_ENV"
          else
            BT="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
            test -n "$BT"
            echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          fi
          echo "Android 36 platform is already present; no sdkmanager download is used."

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean lint compile assemble
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -type f | head -1)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/DUWM2-FULLY-INTEGRATED-FIX2.apk"
          ls -lh "$RUNNER_TEMP/DUWM2-FULLY-INTEGRATED-FIX2.apk"

      - name: Upload DUWM2 FIX2 APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM2-FULLY-INTEGRATED-FIX2-APK
          path: ${{ runner.temp }}/DUWM2-FULLY-INTEGRATED-FIX2.apk
          if-no-files-found: error
          retention-days: 14
