      - name: Enforce native-only application architecture
        shell: bash
        run: |
          set -euo pipefail
          source_root="$PROJECT_DIR/app/src"
          if grep -R -nE 'import[[:space:]]+android\.webkit|new[[:space:]]+WebView' "$source_root"; then
            echo "A browser wrapper was detected. This workflow only builds the native app." >&2
            exit 1
          fi
          if grep -R -n 'chatgpt\.site' "$source_root"; then
            echo "A ChatGPT Site URL was detected. This native build must stand alone." >&2
            exit 1
          fi
          grep -q 'extends View' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          grep -q 'WorldDataRepository' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'import okio.ByteString;' "$source_root/main/java/com/sentongoharuna/worldsituationroom/AisStreamClient.java"
          grep -q 'SATELLITE LAYER / SYNCHRONISING' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          grep -q 'drawOperationalSweep' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          grep -q 'drawGlobe' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          grep -q 'projectGlobe' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          grep -q 'postInvalidateOnAnimation' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          grep -q 'GLOBAL OPERATIONS / SOURCE-ATTRIBUTED SIGNALS' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          grep -q 'drawMotionTrail' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          grep -q 'recordActivityPulse' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          grep -q 'class SignalBeaconView' "$source_root/main/java/com/sentongoharuna/worldsituationroom/SignalBeaconView.java"
          grep -q 'R15: contemporary newsroom palette' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'side readouts are words and figures only' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'rail.setBackgroundColor(Color.TRANSPARENT)' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'RippleDrawable' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'sans-serif-medium' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'LATEST INTELLIGENCE / NEWEST FIRST' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'SOURCE HEALTH / OPERATIONAL' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'Urgency/operations — not a truth rating' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'WINDY_WEBCAM_MAX_OFFSET' "$source_root/main/java/com/sentongoharuna/worldsituationroom/AppConfig.java"
          grep -q 'Camera pages' "$source_root/main/java/com/sentongoharuna/worldsituationroom/WorldDataRepository.java" || \
            grep -q 'worldwide public camera' "$source_root/main/java/com/sentongoharuna/worldsituationroom/WorldDataRepository.java"
          grep -q 'LIVE TRACK' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'DISPLAY • GLOBE' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'RADIO_BROWSER' "$source_root/main/java/com/sentongoharuna/worldsituationroom/AppConfig.java"
          grep -q 'IPTV_CHANNELS' "$source_root/main/java/com/sentongoharuna/worldsituationroom/AppConfig.java"
          grep -q 'CATALOG_CATEGORIES' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'LIVE SOURCE INDEX / AIRCRAFT' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'VIEW CAMERA IN APP' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'WATCH TV IN APP' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'class NativeMediaActivity' "$source_root/main/java/com/sentongoharuna/worldsituationroom/NativeMediaActivity.java"
          grep -q 'VideoView' "$source_root/main/java/com/sentongoharuna/worldsituationroom/NativeMediaActivity.java"
          grep -q 'ImageView' "$source_root/main/java/com/sentongoharuna/worldsituationroom/NativeMediaActivity.java"
          grep -q 'android:name=".NativeMediaActivity"' "$source_root/main/AndroidManifest.xml"
          grep -q 'PUBLIC SOURCE' "$source_root/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          grep -q 'prioritizeViewport' "$source_root/main/java/com/sentongoharuna/worldsituationroom/TileStore.java"
          if grep -q 'import okhttp3.ByteString;' "$source_root/main/java/com/sentongoharuna/worldsituationroom/AisStreamClient.java"; then
            echo "Wrong OkHttp ByteString package detected." >&2
            exit 1
          fi
          grep -q 'com.sentongoharuna.worldsituationroom' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 15' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "15.0-2026-native-source-index"' "$PROJECT_DIR/app/build.gradle.kts"
          echo "Native-only source guard passed."

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Compile, lint and assemble native APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace --warning-mode all \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify and name installable APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          output_dir="$RUNNER_TEMP/world-situation-room-native-r15-apk"
          output_apk="$output_dir/World-Situation-Room-R15-Native-Source-Index.apk"
          test -s "$source_apk"
          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_apk"
          test "$(find "$output_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          test "${output_apk##*.}" = "apk"
          test "$(head -c 2 "$output_apk")" = "PK"
          aapt_bin="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$aapt_bin" dump badging "$output_apk" | grep -F "package: name='com.sentongoharuna.worldsituationroom'"
          "$aapt_bin" dump badging "$output_apk" | grep -F "application-label:'World Situation Room'"
          unzip -tq "$output_apk"
          apk_sha="$(sha256sum "$output_apk" | cut -d' ' -f1)"
          apk_size="$(du -h "$output_apk" | cut -f1)"
          {
            echo "## World Situation Room — Native Android R15 Source Index"
            echo
            echo "- **APK:** World-Situation-Room-R15-Native-Source-Index.apk"
            echo "- **Package:** com.sentongoharuna.worldsituationroom"
            echo "- **Size:** $apk_size"
            echo "- **SHA-256:** \`$apk_sha\`"
            echo "- **Architecture:** native Android Views + frame-synchronised Canvas globe; no WebView or site URL"
            echo "- **Signals:** event-driven green/amber/red lights with independent finite pulse rhythms"
            echo "- **Presentation:** no boxed side rails; live words and figures float at the globe edges"
            echo "- **2026 UI:** translucent rounded surfaces, modern type hierarchy, hairline borders and touch ripples"
            echo "- **Motion:** real acquisitions, tracks and a faint bearing sweep stay behind readable data surfaces"
            echo "- **Cameras:** provider-permitted worldwide Windy camera atlas with paged caching and graceful partial results"
            echo "- **Source pages:** aircraft, ships, boats, weather, events, categorized news, radio, calls/frequencies, TV and cameras"
            echo "- **Native media:** direct public radio, TV and camera media opens inside Android views; no media website wrapper"
            echo "- **Safety:** cleartext, metadata-less, closed, NSFW and provider-blocklisted TV entries are excluded"
            echo "- **Distribution:** one raw APK; no Pages deployment, website, or ZIP wrapper"
            echo "- **Minimum Android:** 6.0 (API 23)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/world-situation-room-native-r15-apk/World-Situation-Room-R15-Native-Source-Index.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
