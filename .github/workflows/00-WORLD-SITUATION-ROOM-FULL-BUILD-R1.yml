          echo "9ae432a6dc042f7a31e3d644905446b63dbab32106bc012062aa340b9b717108  ${SOURCE_ARCHIVE}" | sha256sum --check --strict
          rm -f index.html
          rm -rf github
          tar -xzf "${SOURCE_ARCHIVE}" -C "${GITHUB_WORKSPACE}"

      - name: Save complete application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source is already current."
          else
            git commit -m "Install complete World Situation Room application [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        shell: bash
        run: pnpm exec tsc --noEmit

      - name: Build production application
        shell: bash
        run: pnpm build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-SITUATION-ROOM-R1-${{ github.run_number }}
          path: |
            dist/
            README.md
            .env.example
            config.js
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
