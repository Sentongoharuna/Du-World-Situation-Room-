          DU_R26_NATIVE_SOURCE
          echo "bb6fa19a593acea075617f51de93df8c7b625035666d0528364a5a5ab346d4c6  $archive" | sha256sum --check --strict -
          restore_root="$RUNNER_TEMP/world-situation-room-native-r26-source"
          mkdir -p "$restore_root"
          tar -xzf "$archive" -C "$restore_root"
          project_dir="$restore_root/world-situation-room-native-r26"
          test -s "$project_dir/settings.gradle.kts"
          test -s "$project_dir/app/src/main/AndroidManifest.xml"
          test -s "$project_dir/scripts/verify-r26-widget-runtime.sh"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Enforce standalone native and functional-widget contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/verify-r26-widget-runtime.sh"
          "$PROJECT_DIR/scripts/verify-r26-widget-runtime.sh"
          if grep -REn 'android\.webkit\.WebView|<WebView|loadUrl\(|chatgpt\.site|github\.io/Sentongoharuna' "$PROJECT_DIR/app/src/main"; then
            echo 'Hosted-site or WebView code violates the standalone native contract.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(implementation|api)\(' "$PROJECT_DIR/app/build.gradle.kts"; then
            echo 'R26 must remain free of external runtime libraries.' >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Lint, compile and assemble R26 native APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --no-configuration-cache --stacktrace --warning-mode all \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify, inspect and name direct APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          output_dir="$RUNNER_TEMP/du-world-moniter-native-r26-apk"
          output_apk="$output_dir/du-world-moniter-R26-Functional-Widgets.apk"
          test -s "$source_apk"
          ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            "$PROJECT_DIR/scripts/verify-r26-widget-runtime.sh" "$source_apk"
          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_apk"
          test "$(find "$output_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(head -c 2 "$output_apk")" = 'PK'

          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$build_tools/aapt" dump badging "$output_apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.sentongoharuna.worldsituationroom' versionCode='29' versionName='26.0-2026-widget-runtime-repair'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "sdkVersion:'23'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "targetSdkVersion:'35'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'du-world moniter'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "provides-component:'app-widget'" "$RUNNER_TEMP/apk-badging.txt"
          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk"
          unzip -tq "$output_apk"

          while IFS= read -r dex; do
            if unzip -p "$output_apk" "$dex" | strings | grep -Ei \
              'android/webkit/WebView|okhttp3|okio/ByteString'; then
              echo "Forbidden browser or removed dependency found in $dex" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$output_apk" | grep -E '^classes[0-9]*\.dex$')

          apk_sha="$(sha256sum "$output_apk" | cut -d' ' -f1)"
          apk_size="$(du -h "$output_apk" | cut -f1)"
          {
            echo '## du-world moniter — Native Android R26 Functional Widget Runtime'
            echo
            echo '- **APK:** du-world-moniter-R26-Functional-Widgets.apk'
            echo '- **Package:** com.sentongoharuna.worldsituationroom'
            echo "- **Size:** $apk_size"
            echo "- **SHA-256:** \`$apk_sha\`"
            echo '- **Architecture:** standalone native Android Views/Canvas/TLS/media; no WebView or hosted app'
            echo '- **Eight widgets:** Alert, Counters, Local, Wire, Air & Sea, Hazards & Weather, Media, Command Centre'
            echo '- **Profiles:** per-widget label, region, severity, broad distance lens and background-refresh choice'
            echo '- **Credibility:** source, acquisition age and UNVERIFIED/REPORTED/CONFIRMED state remain explicit'
            echo '- **Command widget:** UTC/local clocks, bounded globe snapshot, provider counts, health and top signals'
            echo '- **Runtime repair:** only RemoteViews-safe elements, ImageView state signals and launcher recovery surface'
            echo '- **Picker repair:** eight scalable preview layouts plus Android 15–16 preview-image fallbacks'
            echo '- **Refresh:** immediate first acquisition, shared cache, manual bounded acquisition and Android-batched periodic work'
            echo '- **Coverage:** provider-returned records only; AISStream/Windy remain optional keyed sources'
            echo '- **Minimum Android:** 6.0 (API 23)'
            echo '- **Distribution:** one direct APK artifact; no Pages site and no ZIP wrapper'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload direct R26 APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: du-world-moniter-R26-Functional-Widgets-${{ github.run_number }}
          path: ${{ runner.temp }}/du-world-moniter-native-r26-apk/du-world-moniter-R26-Functional-Widgets.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
