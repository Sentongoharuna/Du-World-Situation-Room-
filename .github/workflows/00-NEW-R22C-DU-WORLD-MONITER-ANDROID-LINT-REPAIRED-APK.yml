      - name: Enforce standalone native architecture
        shell: bash
        run: |
          set -euo pipefail
          source_root="$PROJECT_DIR/app/src"
          java_root="$source_root/main/java/com/sentongoharuna/worldsituationroom"
          fail_if_found() {
            local pattern="$1"
            local message="$2"
            if grep -R -nE "$pattern" "$source_root"; then
              echo "$message" >&2
              exit 1
            fi
          }
          require_file() {
            if [[ ! -s "$1" ]]; then
              echo "Required native source is missing: $1" >&2
              exit 1
            fi
          }
          require_text() {
            if ! grep -Fq -- "$2" "$1"; then
              echo "Required R22 feature is missing from $1: $2" >&2
              exit 1
            fi
          }

          fail_if_found 'import[[:space:]]+android\.webkit|new[[:space:]]+WebView' \
            'A WebView or browser wrapper was detected.'
          fail_if_found 'chatgpt\.site|github\.io/Sentongoharuna' \
            'A hosted application URL was detected.'
          if grep -nE 'implementation\(|api\(' "$PROJECT_DIR/app/build.gradle.kts"; then
            echo 'R22 must remain free of external runtime libraries.' >&2
            exit 1
          fi

          require_file "$java_root/MainActivity.java"
          require_file "$java_root/SatelliteMapView.java"
          require_file "$java_root/WorldDataRepository.java"
          require_file "$java_root/NativeMediaActivity.java"
          require_file "$java_root/NativeWebSocket.java"
          require_file "$java_root/SituationAnalyzer.java"
          require_file "$java_root/ReferenceCatalog.java"
          require_file "$java_root/RegionalFocus.java"
          require_file "$java_root/ShareCardData.java"
          require_file "$java_root/ShareCardRenderer.java"
          require_file "$java_root/ShareCardProvider.java"
          require_file "$PROJECT_DIR/scripts/verify-r22-feature-contract.sh"
          require_text "$java_root/MainActivity.java" 'GLOBAL INTELLIGENCE BRIEF / SOURCE-AWARE'
          require_text "$java_root/MainActivity.java" 'buildMissionDock'
          require_text "$java_root/MainActivity.java" 'CROSS-SOURCE WATCH'
          require_text "$java_root/MainActivity.java" 'CROSS-DOMAIN PROXIMITY WATCHES'
          require_text "$java_root/MainActivity.java" 'TIME_WINDOWS = {"1H", "6H", "24H", "72H"}'
          require_text "$java_root/MainActivity.java" 'addMissionAction(row, "REGION"'
          require_text "$java_root/MainActivity.java" 'derived from timezone only, not GPS'
          require_text "$java_root/MainActivity.java" 'NOT A FORECAST'
          require_text "$java_root/MainActivity.java" 'layersPanel.setVisibility(View.GONE)'
          require_text "$java_root/MainActivity.java" 'wirePanel.setVisibility(View.GONE)'
          require_text "$java_root/MainActivity.java" 'FOLLOW ON SATELLITE MAP'
          require_text "$java_root/MainActivity.java" 'SOURCE POSITION AGE'
          require_text "$java_root/MainActivity.java" 'showStartupShell("PREPARING NATIVE COMMAND DECK")'
          require_text "$java_root/MainActivity.java" 'APP READY • LIVE SOURCES JOINING'
          require_text "$java_root/SatelliteMapView.java" 'extends View'
          require_text "$java_root/SatelliteMapView.java" 'SHORT ESTIMATE ACTIVE'
          require_text "$java_root/SatelliteMapView.java" 'drawLabelTiles'
          require_text "$java_root/SatelliteMapView.java" 'buildRenderSnapshot(value)'
          require_text "$java_root/WorldDataRepository.java" 'NOAA_PLANETARY_K_INDEX'
          require_text "$java_root/WorldDataRepository.java" 'updateTrackingViewport'
          require_text "$java_root/AisStreamClient.java" 'NativeWebSocket'
          require_text "$java_root/AisStreamClient.java" 'BoundingBoxes'
          require_text "$java_root/NativeMediaActivity.java" 'VideoView'
          require_text "$java_root/NativeMediaActivity.java" 'ImageView'
          require_text "$java_root/NativeMediaActivity.java" 'SHARE INFORMATION CARD'
          require_text "$java_root/MainActivity.java" 'SHARE THIS PAGE AS CARD'
          require_text "$java_root/MainActivity.java" 'detailShareButton = actionButton("SHARE CARD", GREEN)'
          require_text "$java_root/ShareCardData.java" 'public static final String BRAND = "du-world moniter"'
          require_text "$java_root/ShareCardRenderer.java" 'Intent.ACTION_SEND'
          require_text "$java_root/ShareCardRenderer.java" 'Intent.EXTRA_STREAM'
          require_text "$java_root/ShareCardProvider.java" 'extends ContentProvider'
          require_text "$java_root/SituationAnalyzer.java" 'class DomainWatch'
          require_text "$java_root/SituationAnalyzer.java" 'Proximity does not prove connection.'
          require_text "$java_root/RegionalFocus.java" 'timezone without asking for GPS'
          require_text "$java_root/ReferenceCatalog.java" 'PUBLIC_SOURCE'
          require_text "$PROJECT_DIR/app/build.gradle.kts" 'compileSdk = 36'
          require_text "$PROJECT_DIR/app/build.gradle.kts" 'versionCode = 25'
          require_text "$PROJECT_DIR/app/build.gradle.kts" 'versionName = "22.1-2026-api23-lint-repair"'
          require_text "$java_root/TileStore.java" 'private final ConcurrentMap<String, TileTask> queuedTasks'
          require_text "$java_root/TileStore.java" 'private final ConcurrentMap<String, HttpsURLConnection> activeConnections'
          require_text "$source_root/main/AndroidManifest.xml" 'android:name=".NativeMediaActivity"'
          require_text "$source_root/main/AndroidManifest.xml" 'android:name=".ShareCardProvider"'

          if grep -qE 'drawOperationalSweep|markerPhase' "$java_root/SatelliteMapView.java"; then
            echo 'Synthetic sweep or fake marker motion was detected.' >&2
            exit 1
          fi
          "$PROJECT_DIR/scripts/verify-r22-feature-contract.sh" "$PROJECT_DIR"
          echo 'Standalone native R22C API-23-compatible stable-map source guard passed.'

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Lint, compile and assemble native APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --no-configuration-cache --stacktrace --warning-mode all \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify and name installable APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          output_dir="$RUNNER_TEMP/du-world-moniter-native-r22c-apk"
          output_apk="$output_dir/du-world-moniter-R22C-Android-Lint-Repaired.apk"
          test -s "$source_apk"
          ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            "$PROJECT_DIR/scripts/verify-r22-feature-contract.sh" "$PROJECT_DIR" "$source_apk"
          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_apk"
          test "$(find "$output_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(head -c 2 "$output_apk")" = 'PK'

          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$build_tools/aapt" dump badging "$output_apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.sentongoharuna.worldsituationroom' versionCode='25'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "sdkVersion:'23'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "targetSdkVersion:'35'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'du-world moniter'" "$RUNNER_TEMP/apk-badging.txt"
          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk"
          unzip -tq "$output_apk"

          while IFS= read -r dex; do
            if unzip -p "$output_apk" "$dex" | strings | grep -Ei \
              'android/webkit/WebView|okhttp3|okio/ByteString'; then
              echo "Forbidden browser or removed dependency found in $dex" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$output_apk" | grep -E '^classes[0-9]*\.dex$')

          apk_sha="$(sha256sum "$output_apk" | cut -d' ' -f1)"
          apk_size="$(du -h "$output_apk" | cut -f1)"
          {
            echo '## du-world moniter — Native Android R22C Lint-Repaired Stable Map Renderer'
            echo
            echo '- **APK:** du-world-moniter-R22C-Android-Lint-Repaired.apk'
            echo '- **Package:** com.sentongoharuna.worldsituationroom'
            echo "- **Size:** $apk_size"
            echo "- **SHA-256:** \`$apk_sha\`"
            echo '- **Architecture:** native Android Views, Canvas, TLS networking and media APIs; no WebView or hosted site'
            echo '- **Globe:** rotating global command view plus zoomable satellite tracker, place labels, ports and airport/runway context'
            echo '- **Stable map:** visible satellite tiles are pinned and radar/label overlays use a separate bounded cache'
            echo '- **Zoom continuity:** real parent imagery remains visible until the requested detailed tile is ready'
            echo '- **Provider fallback:** one cache key tries Esri satellite then dark fallback; missing imagery retries every 15 seconds'
            echo '- **Viewport control:** only off-screen tile work is cancelled; marker animation does not restart map downloads'
            echo '- **Mobile HUD:** smaller transparent readouts preserve the map as the dominant surface'
            echo '- **R22C compatibility:** atomic tile-task cleanup uses the API-23-safe ConcurrentMap contract; Android lint remains enforced'
            echo '- **R22 startup:** first-frame native shell, staged providers, bounded Canvas workload and background analysis'
            echo '- **Universal sharing:** visible share-card actions for provider records, map details, wire entries, media, weather frames, risk, analyst, source and intelligence rows'
            echo '- **Share output:** local 1080×1350 PNG branded du-world moniter plus complete source-attributed text through Android share sheet'
            echo '- **Regional lens:** timezone-derived opening focus with no GPS or location permission'
            echo '- **Recency:** explicit 1h, 6h, 24h and 72h wire windows'
            echo '- **Live telemetry:** OpenSky aircraft and optional AISStream vessels with source-fix age and capped estimates'
            echo '- **Weather:** playable 12-frame RainViewer history covering two hours at ten-minute steps'
            echo '- **Events:** USGS, NASA EONET, NOAA SWPC, GDELT DOC/GKG and configurable RSS with source-aware credibility labels'
            echo '- **Directories:** native pages for radio, aviation frequencies, user-authorized public-safety audio, television and public webcams'
            echo '- **Markets:** FX/crypto reference quotes plus explicit commodity-provider availability; not trading advice'
            echo '- **Intelligence:** 34-country observed-signal desk, cross-source correlation, air/sea proximity and movement-pattern watches; no prediction or automatic confirmation'
            echo '- **Cameras:** direct provider frames auto-refresh every 12 seconds in the native viewer'
            echo '- **Source registry:** every provider, key requirement, coverage limit and licensed-wire gap remains visible'
            echo '- **Credentials:** optional keys stay encrypted on-device and are not compiled into the APK'
            echo '- **Minimum Android:** 6.0 (API 23)'
            echo '- **Distribution:** one raw APK artifact; no Pages deployment, website or ZIP wrapper'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: du-world-moniter-R22C-Android-Lint-Repaired-${{ github.run_number }}
          path: ${{ runner.temp }}/du-world-moniter-native-r22c-apk/du-world-moniter-R22C-Android-Lint-Repaired.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
