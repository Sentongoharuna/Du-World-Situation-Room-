          echo "5141f3299e41232a9865016d7ee61a4b18db56d48107c2b542cc4cf0bd7428a8  $archive" | sha256sum --check --strict -
          restore_root="$RUNNER_TEMP/world-situation-room-native-r28-source"
          mkdir -p "$restore_root"
          tar -xzf "$archive" -C "$restore_root"
          project_dir="$restore_root/world-situation-room-native-r28"
          test -s "$project_dir/settings.gradle.kts"
          test -s "$project_dir/app/src/main/AndroidManifest.xml"
          test -s "$project_dir/scripts/verify-r28-local-monitors.sh"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Enforce preserved R27 and native R28 feature contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/verify-r27-live-motion-widgets.sh"
          chmod +x "$PROJECT_DIR/scripts/verify-r28-local-monitors.sh"
          "$PROJECT_DIR/scripts/verify-r28-local-monitors.sh"
          if grep -REn 'android\.webkit\.WebView|<WebView|loadUrl\(|chatgpt\.site|github\.io/Sentongoharuna' "$PROJECT_DIR/app/src/main"; then
            echo 'Hosted-site or WebView code violates the standalone native contract.' >&2
            exit 1
          fi
          if grep -En '^[[:space:]]*(implementation|api)\(' "$PROJECT_DIR/app/build.gradle.kts"; then
            echo 'R28 must remain free of external Android runtime libraries.' >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Lint, compile and assemble R28 native APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --no-configuration-cache --stacktrace --warning-mode all \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify, inspect and name direct R28 APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          output_dir="$RUNNER_TEMP/du-world-moniter-native-r28-apk"
          output_apk="$output_dir/du-world-moniter-R28-Local-Monitors-Live-Reports.apk"
          test -s "$source_apk"
          ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            "$PROJECT_DIR/scripts/verify-r28-local-monitors.sh" "$source_apk"
          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_apk"
          test "$(find "$output_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(head -c 2 "$output_apk")" = 'PK'

          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$build_tools/aapt" dump badging "$output_apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.sentongoharuna.worldsituationroom' versionCode='31' versionName='28.0-2026-local-monitors'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "sdkVersion:'23'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "targetSdkVersion:'35'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'du-world moniter'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "provides-component:'app-widget'" "$RUNNER_TEMP/apk-badging.txt"
          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk"
          unzip -tq "$output_apk"

          while IFS= read -r dex; do
            if unzip -p "$output_apk" "$dex" | strings | grep -Ei \
              'android/webkit/WebView|okhttp3|okio/ByteString'; then
              echo "Forbidden browser or removed dependency found in $dex" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$output_apk" | grep -E '^classes[0-9]*\.dex$')

          apk_sha="$(sha256sum "$output_apk" | cut -d' ' -f1)"
          apk_size="$(du -h "$output_apk" | cut -f1)"
          {
            echo '## du-world moniter — Native Android R28 Local Monitors'
            echo
            echo '- **APK:** du-world-moniter-R28-Local-Monitors-Live-Reports.apk'
            echo '- **Package:** com.sentongoharuna.worldsituationroom'
            echo "- **Size:** $apk_size"
            echo "- **SHA-256:** \`$apk_sha\`"
            echo '- **R27 preserved:** globe, public-source layers, replay, analysis and eight live-motion widgets'
            echo '- **Entry:** MONITORS is the second globe mission-dock action'
            echo '- **Profiles:** name, handle, home area, bio, follow and block controls'
            echo '- **Reports:** record video, choose video, caption, manual location and optional permitted coordinates'
            echo '- **Feed:** vertical swipe playback, story/profile rail, For You, Live, Nearby and Following views'
            echo '- **Social:** likes, comments, sharing, following and harmful/misleading-content flags'
            echo '- **Stories:** optional 24-hour expiry with persistent-report choice'
            echo '- **Truth:** every new report starts UNVERIFIED; profile status and report credibility remain separate'
            echo '- **Offline safety:** local video and outbox survive missing service or failed upload'
            echo '- **Cross-device service:** configurable HTTPS Local Monitors API with Keystore-encrypted tokens'
            echo '- **Live:** server-created publisher/playback sessions; recorded clips are never falsely marked live'
            echo '- **Privacy:** location permission is optional; manual location reporting remains available'
            echo '- **Architecture:** standalone native Android Views/media/HTTPS; no WebView or external runtime library'
            echo '- **Minimum Android:** 6.0 (API 23)'
            echo '- **Distribution:** one direct APK artifact; no Pages site and no ZIP wrapper'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload direct R28 APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: du-world-moniter-R28-Local-Monitors-${{ github.run_number }}
          path: ${{ runner.temp }}/du-world-moniter-native-r28-apk/du-world-moniter-R28-Local-Monitors-Live-Reports.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
