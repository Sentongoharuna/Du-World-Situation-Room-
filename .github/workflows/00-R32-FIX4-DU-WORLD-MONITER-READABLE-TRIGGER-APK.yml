name: DU-WORLD MONITER R32 FIX4 - LOGO BRAND APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/00-R32-FIX4-DU-WORLD-MONITER-READABLE-TRIGGER-APK.yml"

permissions:
  contents: read

concurrency:
  group: du-world-moniter-native-r32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-android:
    name: Build R32 native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Prepare R32 source restore
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/du-r32-source.b64"

      - name: Install exact transparent DEVELOP.UGANDA R32 logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          cat > "$RUNNER_TEMP/du-r32-logo.b64" <<'DU_R32_LOGO'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          DU_R32_LOGO
          base64 --decode "$RUNNER_TEMP/du-r32-logo.b64" > app/src/main/res/drawable-nodpi/du_develop_uganda_logo.png
          test "$(sha256sum app/src/main/res/drawable-nodpi/du_develop_uganda_logo.png | awk '{print $1}')" = "bd442a4691a2d42e9086e46228ad25fdabb565ff0ccdf2fea7ffded8ff00ca62"

