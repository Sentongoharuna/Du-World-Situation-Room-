          WSR_NATIVE_SOURCE
          echo "43c5d9f736a0a900d4508c079b49294e8369906322f22337f78ba7f794185539  $archive" | sha256sum --check -
          restore_root="$RUNNER_TEMP/world-situation-room-native-r24-source"
          mkdir -p "$restore_root"
          tar -xzf "$archive" -C "$restore_root"
          project_dir="$restore_root/world-situation-room-native-r24"
          test -s "$project_dir/settings.gradle.kts"
          test -s "$project_dir/app/src/main/AndroidManifest.xml"
          test -s "$project_dir/scripts/verify-r24-feature-contract.sh"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Enforce standalone R24 native contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/verify-r24-feature-contract.sh"
          "$PROJECT_DIR/scripts/verify-r24-feature-contract.sh" "$PROJECT_DIR"
          if grep -R -nE 'import[[:space:]]+android\.webkit|new[[:space:]]+WebView|chatgpt\.site|github\.io/Sentongoharuna' "$PROJECT_DIR/app/src"; then
            echo 'Hosted-site or WebView code violates the standalone native contract.' >&2
            exit 1
          fi
          if grep -nE 'implementation\(|api\(' "$PROJECT_DIR/app/build.gradle.kts"; then
            echo 'R24 must remain free of external runtime libraries.' >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Lint, compile and assemble native APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --no-configuration-cache --stacktrace --warning-mode all \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify and name installable APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          output_dir="$RUNNER_TEMP/du-world-moniter-native-r24-apk"
          output_apk="$output_dir/du-world-moniter-R24-4D-Fusion.apk"
          test -s "$source_apk"
          ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            "$PROJECT_DIR/scripts/verify-r24-feature-contract.sh" "$PROJECT_DIR" "$source_apk"
          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_apk"
          test "$(find "$output_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(head -c 2 "$output_apk")" = 'PK'

          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$build_tools/aapt" dump badging "$output_apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.sentongoharuna.worldsituationroom' versionCode='27'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "sdkVersion:'23'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "targetSdkVersion:'35'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'du-world moniter'" "$RUNNER_TEMP/apk-badging.txt"
          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk"
          unzip -tq "$output_apk"

          while IFS= read -r dex; do
            if unzip -p "$output_apk" "$dex" | strings | grep -Ei \
              'android/webkit/WebView|okhttp3|okio/ByteString'; then
              echo "Forbidden browser or removed dependency found in $dex" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$output_apk" | grep -E '^classes[0-9]*\.dex$')

          apk_sha="$(sha256sum "$output_apk" | cut -d' ' -f1)"
          apk_size="$(du -h "$output_apk" | cut -f1)"
          {
            echo '## du-world moniter — Native Android R24 4D Fusion'
            echo
            echo '- **APK:** du-world-moniter-R24-4D-Fusion.apk'
            echo '- **Package:** com.sentongoharuna.worldsituationroom'
            echo "- **Size:** $apk_size"
            echo "- **SHA-256:** \`$apk_sha\`"
            echo '- **Architecture:** standalone native Android Views, Canvas, TLS networking and platform media; no WebView or hosted site'
            echo '- **4D replay:** up to 60 minutes of frames actually acquired in this session; no manufactured history'
            echo '- **Fusion desk:** news/natural anchors aligned with nearby air, sea, orbital and official airspace context; proximity is not confirmation'
            echo '- **Calculated orbits:** stations, weather satellites and GPS operational objects from cached CelesTrak GP elements; not live telemetry or safety data'
            echo '- **Airspace:** official Aviation Weather Center worldwide SIGMET records with representative polygon points'
            echo '- **Globe HUD:** provider-count arcs, independently timed source lights, rotating globe and drill-down satellite map'
            echo '- **Live telemetry:** OpenSky aircraft and optional AISStream vessels with source-fix age, observed trails and capped estimates'
            echo '- **Events:** USGS, NASA EONET, NOAA SWPC, GDELT DOC/GKG and configurable RSS with explicit credibility labels'
            echo '- **Weather:** RainViewer history and animation; replay selects the closest acquired frame'
            echo '- **Native media:** provider-permitted webcams, public radio, safe public TV and user-authorized direct public-safety audio'
            echo '- **Universal sharing:** source, UTC time, credibility and disclaimers remain on every generated information card'
            echo '- **Performance:** first-frame shell, staged providers, bounded Canvas snapshots, source caches and independent backoff'
            echo '- **Minimum Android:** 6.0 (API 23)'
            echo '- **Distribution:** one direct APK artifact; no Pages deployment, website or ZIP wrapper'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: du-world-moniter-R24-4D-Fusion-${{ github.run_number }}
          path: ${{ runner.temp }}/du-world-moniter-native-r24-apk/du-world-moniter-R24-4D-Fusion.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
