      - name: Decode verify and restore R33 native source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/du-r33-source.tar.gz"
          base64 --decode "$RUNNER_TEMP/du-r33-source.b64" > "$archive"
          echo "0088687488f1acc9977da50fce2c06f2115ad03e649370695b4dff6b8c5461ba  $archive" | sha256sum --check --strict -
          restore_root="$RUNNER_TEMP/du-r33-source"
          mkdir -p "$restore_root"
          tar -xzf "$archive" -C "$restore_root"
          project_dir="$restore_root/world-situation-room-native-r30"
          test -s "$project_dir/settings.gradle.kts"
          test -s "$project_dir/scripts/verify-r33-local-news.sh"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Verify R33 Local News and preserved native contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/verify-r33-local-news.sh"
          "$PROJECT_DIR/scripts/verify-r33-local-news.sh" "$PROJECT_DIR"
          if grep -REn 'android\.webkit\.WebView|<WebView|loadUrl\(|okhttp3|okio/ByteString' "$PROJECT_DIR/app/src/main"; then exit 1; fi
          if grep -En '^[[:space:]]*(implementation|api)\(' "$PROJECT_DIR/app/build.gradle.kts"; then exit 1; fi

      - name: Verify isolated safe native DU logo
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/verify-r33-safe-logo-upgrade.sh"
          "$PROJECT_DIR/scripts/verify-r33-safe-logo-upgrade.sh" "$PROJECT_DIR"

      - name: Verify advanced UX navigation and live wallpaper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/verify-r33-upgrade7-ux-wallpaper.sh"
          "$PROJECT_DIR/scripts/verify-r33-upgrade7-ux-wallpaper.sh" "$PROJECT_DIR"

      - name: Verify UPGRADE8 full UX integration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/verify-r33-upgrade8-full-ux.sh"
          "$PROJECT_DIR/scripts/verify-r33-upgrade8-full-ux.sh" "$PROJECT_DIR"

      - name: Verify UPGRADE9 intelligence suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/verify-r33-upgrade9-intelligence-suite.sh"
          "$PROJECT_DIR/scripts/verify-r33-upgrade9-intelligence-suite.sh" "$PROJECT_DIR"

      - name: Verify DUWM2 unified five-page UI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/verify-duwm2-unified-ui.sh"
          "$PROJECT_DIR/scripts/verify-duwm2-unified-ui.sh" "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Lint compile and assemble R33
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --stacktrace --warning-mode all :app:lintDebug :app:assembleDebug

      - name: Verify and name DUWM1 APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          out="$RUNNER_TEMP/du-world-moniter-R33-Local-News.apk"
          test -s "$source_apk"
          install -m 0644 "$source_apk" "$out"
          aapt="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$out" | tee "$RUNNER_TEMP/r33-badging.txt"
          grep -F "package: name='com.sentongoharuna.worldsituationroom' versionCode='35' versionName='33.0-2026-local-news'" "$RUNNER_TEMP/r33-badging.txt"
          grep -F "sdkVersion:'23'" "$RUNNER_TEMP/r33-badging.txt"
          grep -F "targetSdkVersion:'35'" "$RUNNER_TEMP/r33-badging.txt"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$out"
          unzip -tq "$out"
          echo "APK_PATH=$out" >> "$GITHUB_ENV"
          {
            echo '## DU World Monitor R33 — Local News'
            echo '- Uganda-first Local News feed and source catalog'
            echo '- Duplicate clustering with Also reported by'
            echo '- Offline 7-day/800-story store'
            echo '- Breaking/local/digest notification channels'
            echo '- Background refresh through existing JobService'
            echo '- 13th Local News widget'
            echo '- Existing NEWS globe catalog preserved; mission NEWS opens Local News'
            echo '- No WebView or external runtime libraries'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DUWM1 APK
        uses: actions/upload-artifact@v7
        with:
          name: du-world-moniter-R33-Local-News-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
