<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>World Situation Room</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#070d12; --panel:#0b131a; --panel-2:#0f1a22; --line:#1b2b36;
    --ink:#dbe4ea; --ink-dim:#8394a0; --ink-faint:#5a6b76;
    --air:#6fb2f0; --sea:#4fc9a4; --alert:#e05252; --heat:#e79a2b; --ok:#4fc9a4;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);
    position:relative;z-index:500}
  .brand{display:flex;align-items:center;gap:9px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--alert);
    animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,82,82,.5)}70%{box-shadow:0 0 0 7px rgba(224,82,82,0)}100%{box-shadow:0 0 0 0 rgba(224,82,82,0)}}
  .live{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--alert)}
  .brand h1{font-size:14px;font-weight:500;letter-spacing:.3px}
  .clock{font-family:var(--mono);font-size:12px;color:var(--sea);text-align:right;line-height:1.3}
  .clock small{color:var(--ink-faint);font-size:10px}
  #app{display:flex;height:calc(100% - 46px)}
  #map{flex:1;background:var(--bg)}
  aside{width:300px;flex-shrink:0;border-left:1px solid var(--line);
    background:var(--panel);display:flex;flex-direction:column}
  .layers{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .chip{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:20px;
    border:1px solid var(--line);color:var(--ink-dim);cursor:pointer;user-select:none;background:transparent}
  .chip.on{color:var(--bg);font-weight:600}
  .chip.on[data-k=flights]{background:var(--air);border-color:var(--air)}
  .chip.on[data-k=weather]{background:var(--heat);border-color:var(--heat)}
  .chip.on[data-k=quakes]{background:var(--alert);border-color:var(--alert)}
  .counts{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .count{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
  .count b{color:var(--ink);font-weight:600}
  .news{flex:1;display:flex;flex-direction:column;min-height:0}
  .news-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 6px}
  .news-head .lbl{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--ink-dim)}
  .news-head .stream{font-family:var(--mono);font-size:9px;color:var(--alert)}
  .regions{display:flex;gap:5px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
  .regions::-webkit-scrollbar{display:none}
  .region{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:20px;
    background:var(--panel-2);color:var(--ink-dim);cursor:pointer;white-space:nowrap;border:1px solid transparent}
  .region.on{background:var(--sea);color:var(--bg);font-weight:600}
  .feed{flex:1;overflow-y:auto;padding:0 12px 12px}
  .item{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--panel-2)}
  .item time{font-family:var(--mono);font-size:9px;color:var(--sea);white-space:nowrap;padding-top:2px}
  .item p{font-size:12px;line-height:1.4;color:var(--ink)}
  .item .src{font-family:var(--mono);font-size:9px;color:var(--ink-faint);display:block;margin-top:3px}
  .badge{font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:3px;border:1px solid;margin-right:6px}
  .b-unv{color:var(--alert);border-color:#5a2626}
  .b-rep{color:var(--heat);border-color:#5a4318}
  .b-con{color:var(--ok);border-color:#1f4a3c}
  .offline{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:14px 0;text-align:center;line-height:1.6}
  .leaflet-container{background:var(--bg)}
  .qk{border-radius:50%;background:var(--alert);opacity:.85;border:1px solid #ff9d9d}
  .pl{color:var(--air);font-size:14px;line-height:1;text-shadow:0 0 4px rgba(0,0,0,.8)}
  .leaflet-popup-content-wrapper{background:var(--panel-2);color:var(--ink);border-radius:8px;font-family:var(--mono);font-size:11px}
  .leaflet-popup-tip{background:var(--panel-2)}
  @media(max-width:720px){
    #app{flex-direction:column}
    #map{height:44vh;flex:none}
    aside{width:100%;border-left:none;border-top:1px solid var(--line);flex:1;min-height:0}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span><span class="live">LIVE</span>
    <h1>World Situation Room</h1>
  </div>
  <div class="clock"><span id="utc">--:--:--</span> UTC<br><small id="loc">local --:--</small></div>
</header>
<div id="app">
  <div id="map"></div>
  <aside>
    <div class="layers">
      <span class="chip on" data-k="flights">Flights</span>
      <span class="chip on" data-k="weather">Weather</span>
      <span class="chip on" data-k="quakes">Quakes</span>
    </div>
    <div class="counts">
      <span class="count">&#9992; <b id="c-fl">&mdash;</b></span>
      <span class="count">&#9672; <b id="c-qk">&mdash;</b></span>
      <span class="count">&#9673; <b id="c-nw">&mdash;</b></span>
    </div>
    <div class="news">
      <div class="news-head">
        <span class="lbl">LIVE NEWS</span>
        <span class="stream">&#9679; STREAMING</span>
      </div>
      <div class="regions" id="regions">
        <span class="region on" data-q="Uganda OR Kampala OR Africa">Africa</span>
        <span class="region" data-q="Europe">Europe</span>
        <span class="region" data-q="Asia">Asia</span>
        <span class="region" data-q="Americas OR USA">Americas</span>
        <span class="region" data-q="world">World</span>
      </div>
      <div class="feed" id="feed">
        <div class="offline">connecting to wire&hellip;</div>
      </div>
    </div>
  </aside>
</div>
<script>
const CONFIG = { openWeatherKey:"", windyWebcamsKey:"", aisStreamKey:"" };
const map = L.map('map',{zoomControl:false,worldCopyJump:true,attributionControl:false}).setView([10,20],2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:10,subdomains:'abcd'}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
const layers={flights:L.layerGroup().addTo(map),weather:L.layerGroup().addTo(map),quakes:L.layerGroup().addTo(map)};
function tick(){const n=new Date();document.getElementById('utc').textContent=n.toUTCString().slice(17,25);
  document.getElementById('loc').textContent='local '+n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
setInterval(tick,1000);tick();
document.querySelectorAll('.chip').forEach(chip=>{chip.onclick=()=>{const k=chip.dataset.k,on=chip.classList.toggle('on');
  if(on)layers[k].addTo(map);else map.removeLayer(layers[k]);};});
async function loadQuakes(){try{
  const r=await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson');
