name: DUWM2 UPGRADE30 REAL DEVICE VISUAL QA APK
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          echo "5ae17da3470f6c2a43426f67735cc10fb2bbf550dc3002dedb6762b033ba24f7  DUWM2-UPGRADE30-REAL-DEVICE-VISUAL-QA-SOURCE.tar.gz" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/duwm2";mkdir -p "$RUNNER_TEMP/duwm2"
          tar -xzf DUWM2-UPGRADE30-REAL-DEVICE-VISUAL-QA-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm2"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm2" >> "$GITHUB_ENV"
      - name: Verify visual QA
        run: |
          cd "$PROJECT_DIR";chmod +x scripts/verify-duwm2-fix6-resource-symbol.sh scripts/verify-duwm2-upgrade10-final.sh scripts/verify-duwm2-navigation-matrix.sh scripts/verify-duwm2-visual-qa.sh
          scripts/verify-duwm2-fix6-resource-symbol.sh "$PROJECT_DIR"
          scripts/verify-duwm2-upgrade10-final.sh "$PROJECT_DIR"
          scripts/verify-duwm2-navigation-matrix.sh "$PROJECT_DIR"
          scripts/verify-duwm2-visual-qa.sh "$PROJECT_DIR"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}";test -d "$SDK/platforms/android-36"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV";echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', cache-disabled: true}
      - name: Compile lint assemble
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:processDebugResources :app:lintDebug :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM2-UPGRADE30-REAL-DEVICE-VISUAL-QA-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
